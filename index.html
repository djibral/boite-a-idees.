/* ---------------------------- 12.4 Traitement des clics ---------------------------- */
function handleClick(el){
  const act = el.dataset.act, id = el.dataset.id;
  const i = id ? idea(id) : null;
  switch(act){
    case "close-modal": closeModal(); break;
    case "quick": if (guard("create")) openQuickCapture(); break;
    case "cap-save": saveQuickCapture(); break;
    case "nav": {
      const v = el.dataset.nav;
      UI.view = v; UI.ideaId = (v === "detail" ? UI.ideaId : null); closeModal(); render(); break;
    }
    case "open": {
      UI.view = "detail"; UI.ideaId = id; UI.tab = "synthese"; closeModal();
      window.scrollTo({ top:0, behavior:"smooth" }); render(); break;
    }
    case "tab": { UI.tab = el.dataset.tab; render(); break; }
    case "tab-questions": { UI.view = "detail"; UI.ideaId = id; UI.tab = "questions"; closeModal(); render(); break; }
    case "filter": {
      UI.filters = UI.filters || {};
      const k = el.dataset.k, v = el.dataset.v;
      UI.filters[k] = v; render(); break;
    }
    case "clear-search": { UI.search = ""; $("#globalSearch").value = ""; render(); break; }
    case "fav": if (i){ i.favorite = !i.favorite; touch(i); persist(); render(); } break;
    case "more": if (i) openMore(i); break;
    case "print": if (i) printIdea(i.id); break;
    case "advance": if (i){ const nx = stageNext(i.stage); if (nx) tryAdvance(i, nx.id); } break;
    case "advance-force": {
      if (!i) break;
      const chk = $("#forceChk"), note = $("#forceNote");
      if (chk && !chk.checked){ toast("Cochez « Forcer le passage » pour continuer.", "warn"); break; }
      tryAdvance(i, el.dataset.stage || (stageNext(i.stage)||{}).id, { force:true, note: note ? note.value : "" });
      break;
    }
    case "goto-stage": {
      if (!i) break;
      const target = el.dataset.stage;
      if (target === i.stage) break;
      if (!guard("advance")) break;
      const gap = stageIndex(target) - stageIndex(i.stage);
      if (gap > 1){
        if (!askTwice("Passer directement à « " + (stageDef(target)||{}).label + " » en sautant " + (gap-1) + " étape(s) ?\n\nLes étapes intermédiaires resteront vides dans l'historique. Préférez un avancement étape par étape.")) { render(); break; }
        enterStage(i, target, { note:"Passage direct depuis « " + (stageDef(i.stage)||{}).label + " »" });
        toast("Passage direct à « " + (stageDef(target)||{}).label + " ».", "warn"); render(); break;
      }
      if (gap === 1) tryAdvance(i, target);
      else { enterStage(i, target, {}); toast("Retour à l'étape « " + (stageDef(target)||{}).label + " ».", "warn"); render(); }
      break;
    }
    case "promote": if (i) openPromote(i); break;
    case "promote-confirm": {
      if (!i) break;
      const just = ($("#prJust")||{}).value || "";
      if (just.trim().length < 10){ toast("La justification du GO est obligatoire (10 caractères minimum).", "warn"); break; }
      i.decision = { verdict:"go", rationale:just.trim(), conditions:($("#prCond")||{}).value || "", by:(currentUser()||{}).id, at:nowISO() };
      if ($("#prOwner")) i.project.owner = $("#prOwner").value;
      if ($("#prObj") && $("#prObj").value) i.project.objectives = $("#prObj").value;
      i.status = "active";
      addHistory(i, "décision", "Décision GO : l'idée devient un projet — " + just.trim());
      logAct("décision", i.code + " — GO validé, passage en projet", i.id);
      const firstProjectStage = settings().pipeline.find(s => s.phase === "projet");
      closeModal();
      enterStage(i, firstProjectStage.id, {});
      UI.view = "detail"; UI.ideaId = i.id; UI.tab = "cadrage";
      toast("GO enregistré : le projet est lancé (étape « " + firstProjectStage.label + " »).", "ok");
      render(); break;
    }
    case "verdict": {
      if (!i || !guard("decide")) break;
      const v = el.dataset.v;
      const just = (i.decision.rationale || "").trim();
      if (just.length < 10){ toast("Rédigez d'abord la justification de la décision (onglet Décision).", "warn"); UI.tab = "validation"; render(); break; }
      if (v === "go"){ openPromote(i); break; }
      if (v === "revoir"){
        i.decision = { verdict:"revoir", rationale:just, conditions:i.decision.conditions, by:(currentUser()||{}).id, at:nowISO() };
        addHistory(i, "décision", "Décision « à retravailler » : " + just);
        logAct("décision", i.code + " — à retravailler", i.id);
        const analyse = byId(settings().pipeline, "analyse");
        if (analyse) enterStage(i, analyse.id, { note:"Retour en analyse après décision" });
        persist(); toast("Dossier à retravailler : retour à l'étape Analyse.", "warn"); render(); break;
      }
      if (v === "nogo"){ openReject(i); break; }
      break;
    }
    case "reject": if (i) openReject(i); break;
    case "reject-confirm": {
      if (!i) break;
      const why = ($("#rjWhy")||{}).value || "";
      if (why.trim().length < 10){ toast("Un motif de NO-GO est obligatoire.", "warn"); break; }
      i.decision = { verdict:"nogo", rationale:why.trim(), conditions:($("#rjCond")||{}).value || "", by:(currentUser()||{}).id, at:nowISO() };
      i.status = "rejetee";
      addHistory(i, "décision", "Décision NO-GO : " + why.trim());
      logAct("décision", i.code + " — sans suite", i.id);
      closeModal(); persist(); toast("Idée classée sans suite (conservée et traçable).", "warn"); render(); break;
    }
    case "reopen": {
      if (!i) break;
      i.decision = { verdict:null, rationale:"", conditions:"", by:null, at:null };
      if (i.status === "rejetee") i.status = "active";
      addHistory(i, "décision", "Dossier rouvert : décision effacée, l'idée repasse en validation.");
      persist(); closeModal(); UI.tab = "validation"; toast("Dossier rouvert.", "ok"); render(); break;
    }
    case "park": if (i) openPark(i); break;
    case "park-confirm": {
      if (!i) break;
      i.park = { reason:($("#pkReason")||{}).value + (($("#pkNote")||{}).value ? " — " + $("#pkNote").value : ""),
                reviewAt:($("#pkDate")||{}).value, conditions:($("#pkNote")||{}).value || "", by:(currentUser()||{}).id, at:nowISO() };
      i.status = "parkee";
      addHistory(i, "statut", "Idée parquée : " + i.park.reason + (i.park.reviewAt ? " (réexamen le " + fmtShort(i.park.reviewAt) + ")" : ""));
      logAct("statut", i.code + " — parquée", i.id);
      closeModal(); persist(); toast("Idée parquée, réexamen prévu le " + fmtShort(i.park.reviewAt) + ".", "ok"); render(); break;
    }
    case "unpark": {
      if (!i) break;
      i.status = "active"; i.park = { reason:"", reviewAt:"", conditions:"", by:null, at:null };
      touch(i);
      addHistory(i, "statut", "Idée réactivée depuis le backlog.");
      logAct("statut", i.code + " — réactivée", i.id);
      persist(); toast("Idée réactivée : elle repart au processus.", "ok"); render(); break;
    }
    case "nudge": {
      if (!i) break;
      touch(i);
      addHistory(i, "relance", "Relance : l'idée a été signalée comme dormante.");
      i.comments.unshift({ id:uid("c"), by:(currentUser()||{}).id, at:nowISO(), text:"Relance : cette idée est sans activité depuis " + dormantDays(i) + " jours. Que fait-on ?" });
      persist(); toast("Relance enregistrée et horodatée.", "ok"); render(); break;
    }
    case "archive": {
      if (!i || !guard("archive")) break;

/* ---------------------------- 12.5 Traitement des modifications ---------------------------- */
function handleChange(el){
  const act = el.dataset.act, i = el.dataset.id ? idea(el.dataset.id) : null;
  if (act === "field"){
    if (!i) return;
    const path = el.dataset.path;
    let v = el.value;
    if (el.type === "number") v = v === "" ? "" : Number(v);
    if (el.type === "checkbox") v = el.checked;
    setPath(i, path, v);
    if (path === "description" || path === "title" || path === "project.objectives"){
      const s = analyseText((i.title||"") + ". " + (i.description||""));
      i.auto.suggestion = s;
    }
    if (path === "title" || path === "description") addHistory(i, "modification", "Contenu de l'idée mis à jour.");
    if (path.indexOf("project.budget") === 0 || path.indexOf("project.") === 0) {}
    touch(i); refreshScoring(i); persist();
    if (path.indexOf("budget") > -1 || path.indexOf("project.") === 0) render();
    return;
  }
  if (act === "tags"){
    if (!i) return;
    i.tags = el.value.split(",").map(x => x.trim()).filter(Boolean);
    touch(i); persist(); render(); return;
  }
  if (act === "rating") return;
  if (act === "filter-sel"){
    UI.filters = UI.filters || {}; UI.filters[el.dataset.k] = el.value; render(); return;
  }
  if (act === "task-status"){
    if (!i) return;
    const t = (i.project.tasks||[]).find(x => x.id === el.dataset.t);
    if (t){ t.status = el.value; if (t.status === "terminée") t.progress = 100; touch(i); addHistory(i, "tâche", "Tâche « " + t.title + " » → " + t.status); persist(); render(); }
    return;
  }
  if (act === "q-status"){
    if (!i) return;
    const a = i.answers[el.dataset.q];
    if (a){ a.status = el.value; a.at = nowISO(); a.by = (currentUser()||{}).id;
      touch(i); persist(); render(); }
    return;
  }
  if (act === "li-field" || act === "ms-field" || act === "task-field" || act === "bud-field" || act === "rev-field" || act === "user-field" || act === "crit-field"){
    if (!i && act !== "user-field" && act !== "crit-field") return;
    if (act === "user-field"){
      const u = user(el.dataset.id); if (!u) return;
      u[el.dataset.k] = el.value; persist();
      if (el.dataset.k === "role") render();
      return;
    }
    if (act === "crit-field") return;
    let container, idx;
    if (act === "li-field"){ container = getPath(i, el.dataset.list); idx = Number(el.dataset.idx); }
    else if (act === "ms-field"){ container = i.project.milestones; idx = Number(el.dataset.idx); }
    else if (act === "task-field"){ container = i.project.tasks; idx = Number(el.dataset.idx); }
    else if (act === "bud-field"){ container = i.project.budget.lines; idx = Number(el.dataset.idx); }
    else { container = i.project.reviews; idx = Number(el.dataset.idx); }
    const item = container && container[idx];
    if (!item) return;
    let v = el.value;
    if (el.type === "number" || el.type === "range") v = Number(v);
    item[el.dataset.k] = v;
    touch(i); persist();
    if (["status","progress","assignee","due","estimated","actual","result","type","retained","severity","confidence","probability","impact","effort"].indexOf(el.dataset.k) > -1) render();
    return;
  }
  if (act === "cap-live") return;
}

/* ---------------------------- 12.6 Glisser-déposer ---------------------------- */
let DRAG_ID = null;
document.addEventListener("dragstart", e => {
  const card = e.target.closest ? e.target.closest(".kcard") : null;
  if (!card) return;
  DRAG_ID = card.dataset.id;
  card.classList.add("dragging");
  try { e.dataTransfer.setData("text/plain", DRAG_ID); } catch(err){}
  e.dataTransfer.effectAllowed = "move";
});
document.addEventListener("dragend", e => {
  $$(".kcard.dragging").forEach(c => c.classList.remove("dragging"));
  $$(".kcol.dragover").forEach(c => c.classList.remove("dragover"));
  DRAG_ID = null;
});
document.addEventListener("dragover", e => {
  const col = e.target.closest ? e.target.closest(".kcol") : null;
  if (!col) return;
  e.preventDefault();
  $$(".kcol.dragover").forEach(c => { if (c !== col) c.classList.remove("dragover"); });
  col.classList.add("dragover");
});
document.addEventListener("drop", e => {
  const col = e.target.closest ? e.target.closest(".kcol") : null;
  if (!col) return;
  e.preventDefault();
  const target = col.dataset.drop;
  const id = DRAG_ID || (e.dataTransfer ? e.dataTransfer.getData("text/plain") : "");
  const i = idea(id);
  col.classList.remove("dragover");
  if (!i || !target || target === i.stage) return;
  if (!guard("advance")) return;
  if (stageIndex(target) > stageIndex(i.stage)) tryAdvance(i, target);
  else { enterStage(i, target, {}); toast("Idée ramenée à l'étape « " + (stageDef(target)||{}).label + " ».", "warn"); render(); }
});

    '<div class="cols-3 grid">' +

        '<div class="tiny muted mb8">' + (LS.available ? "Stockage navigateur actif (localStorage)." : "Stockage navigateur indisponible dans cet aperçu : pensez à télécharger le fichier HTML.") + '</div>' +

        '<button class="btn wide mb8" data-act="seed-demo">Charger le jeu d\'exemple</button>' +
        '<button class="btn wide bad" data-act="reset-all">Effacer toutes les données</button>' +

      '</div>' +
      '<div><div class="sec-title mb8">Mode serveur (multi-appareils)</div>' +
        '<div class="tiny muted mb8">Renseignez l\'URL de votre API pour synchroniser l\'état complet. API attendue : GET /api/state, PUT /api/state, GET /api/health (contrat documenté dans le fichier README.md fourni).</div>' +
        '<div class="field"><label class="f">URL du serveur</label><input class="input" data-act="set" data-k="serverUrl" value="' + esc(CFG.serverUrl || "") + '" placeholder="https://mon-serveur.exemple"></div>' +
        '<div class="field"><label class="f">Mode</label><select class="input" data-act="set" data-k="mode">' +
          [["local","Local uniquement (navigateur)"],["server","Local + synchronisation serveur"]].map(m => '<option value="' + m[0] + '"' + (CFG.mode === m[0] ? " selected" : "") + '>' + m[1] + '</option>').join("") + '</select></div>' +
        '<button class="btn sm" data-act="server-test">Tester la connexion</button>' +
        (CFG.mode === "server" ? '<button class="btn sm wide mt8" data-act="server-pull">Recharger depuis le serveur</button>' : '') +

  '</div></div>' +

  '<div class="card"><div class="card-head"><div class="card-title">À propos</div></div><div class="card-body tiny muted">' +
    'Boîte à Idées v' + APP.version + ' — application autonome (un seul fichier HTML, aucune dépendance externe). ' +
    'Schéma de données v' + APP.schema + ' · ' + STATE.ideas.length + ' idées · ' + settings().pipeline.length + ' étapes de processus · ' +
    settings().criteria.filter(c => c.active).length + ' critères de scoring actifs.<br>' +
    'Créée le ' + fmtDT(STATE.meta.createdAt) + ' · dernière écriture ' + fmtDT(SAVE_INFO.lastSave || STATE.meta.updatedAt) + '.' +

/* Gestion des paramètres (changements d\'inputs) */
function settingsChange(el){
  const act = el.dataset.act;
  const s = settings();
  if (act === "set"){
    const k = el.dataset.k, v = el.value;
    if (k === "org") STATE.meta.org = v;
    else if (k === "brandSub") { s.customTitle = v; renderNav(); }
    else if (k === "categories") s.categories = v.split("\n").map(x => x.trim()).filter(Boolean);
    else if (k === "tagVocab") s.tagVocab = v.split("\n").map(x => x.trim()).filter(Boolean);
    else if (k === "dormantDays") s.dormantDays = clamp(Number(v)||30, 3, 999);
    else if (k === "bucketA" || k === "bucketB" || k === "bucketC") s[k] = clamp(Number(v)||0, 1, 100);
    else if (k === "currency") s.currency = v;
    else if (k === "theme"){ CFG.theme = v; document.documentElement.dataset.theme = v; saveCfg(); }
    else if (k === "serverUrl"){ CFG.serverUrl = v.replace(/\/$/,""); saveCfg(); }
    else if (k === "mode"){ CFG.mode = v; saveCfg(); }
    ideas().forEach(i => refreshScoring(i));
    persist(); render();
    return true;
  }
  if (act === "pipe-field"){
    const st = s.pipeline[Number(el.dataset.idx)]; if (!st) return true;
    st[el.dataset.k] = el.value;
    persist();
    if (el.dataset.k === "label" || el.dataset.k === "phase" || el.dataset.k === "color") render();
    return true;
  }
  if (act === "pipe-gate"){
    const st = s.pipeline[Number(el.dataset.idx)]; if (!st) return true;
    st.gate = st.gate || [];
    const g = el.dataset.gate;
    const on = st.gate.includes(g) && el.classList.contains("active");
    st.gate = on ? st.gate.filter(x => x !== g) : uniq(st.gate.concat(g));
    persist(); render(); return true;
  }
  if (act === "q-tpl-field"){
    const key = el.dataset.key, q = (s.questions[key]||[])[Number(el.dataset.idx)];
    if (!q) return true;
    q[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value;
    persist(); return true;
  }
  if (act === "crit-field"){
    const c = byId(s.criteria, el.dataset.crit); if (!c) return true;
    const k = el.dataset.k;
    c[k] = el.type === "checkbox" ? el.checked : (k === "weight" ? clamp(Number(el.value)||0, 0, 100) : el.value);
    ideas().forEach(i => refreshScoring(i));
    persist(); render(); return true;
  }
  return false;
}

/* ============================================================================
   14. Initialisation et câblage global
   ============================================================================ */
/* Retire les exemples fictifs chargés automatiquement par les premières versions.
   Seules les idées d'exemple (titres connus) et les 5 personnes fictives sont retirées ;
   toute idée saisie par l'utilisateur est conservée. */
const DEMO_TITLES = ["Portail de suivi des demandes clients","Automatiser la relance des factures impayées","Refonte de l'espace d'archivage partagé","Panneau d'affichage des indicateurs d'équipe","Numérisation des feuilles de relevé atelier"];
const DEMO_USERS = ["Alex Martin","Élise Dubois","Karim Benali","Sofia Rossi","Tom Leroy"];
function purgeOldDemo(){
  const hasDemoUsers = STATE.users.some(u => DEMO_USERS.includes(u.name));
  if (!hasDemoUsers || LS.get(APP.key + ".demoPurged")) return;
  const before = STATE.ideas.length;
  STATE.ideas = STATE.ideas.filter(i => !DEMO_TITLES.includes(i.title));
  const removed = before - STATE.ideas.length;
  const realUsers = STATE.users.filter(u => !DEMO_USERS.includes(u.name));
  const usedIds = new Set(); STATE.ideas.forEach(i => { usedIds.add(i.author); (i.project.tasks||[]).forEach(t => usedIds.add(t.assignee)); });
  const keepDemo = STATE.users.filter(u => DEMO_USERS.includes(u.name) && usedIds.has(u.id) && u.id !== "u_admin");
  STATE.users = [{ id:"u_admin", name:"D'ji", role:"admin", email:"" }].concat(realUsers.filter(u => u.id !== "u_admin"), keepDemo);
  STATE.ideas.forEach(i => { if (!user(i.author)) i.author = "u_admin"; });
  if (!STATE.ideas.length){ STATE.activity = []; STATE.seq = 0; }
  else STATE.activity = STATE.activity.filter(a => !a.ref || STATE.ideas.some(i => i.id === a.ref));
  if (STATE.meta.org === "Mon organisation") STATE.meta.org = "Boîte à Idées de D'ji";
  CFG.currentUser = "u_admin"; saveCfg();
  LS.set(APP.key + ".demoPurged", "1");
  persistNow();
  if (removed) setTimeout(() => toast(removed + " idée(s) d'exemple retirée(s) : votre boîte est prête.", "ok", 6000), 600);
}
function boot(){
  /* Config utilisateur */
  let raw = LS.get(APP.cfgKey);
  if (raw){ try { CFG = Object.assign(CFG, JSON.parse(raw)); } catch(e){} }
  document.documentElement.dataset.theme = CFG.theme || "dark";
  if (!UI.filters) UI.filters = { status:"active", cat:"", tag:"", phase:"", author:"", sort:"rank" };

  /* Données : serveur si configuré, sinon local */
  STATE = loadLocal();
  purgeOldDemo();
  if (!CFG.currentUser || !user(CFG.currentUser)) CFG.currentUser = STATE.users[0].id;

  if (CFG.mode === "server" && CFG.serverUrl){
    toast("Synchronisation avec le serveur…");
    pullServer().then(res => {
      if (res && res.state && res.state.ideas){
        STATE = migrate(res.state);
        SAVE_INFO.version = res.version || 0; SAVE_INFO.status = "ok";
        toast("Données synchronisées depuis le serveur.", "ok"); render();
      }
    }).catch(e => { SAVE_INFO.status = "erreur"; toast("Serveur injoignable : " + e.message + " — passage en mode local.", "bad"); });
  }

  /* Première ouverture : jeu d'exemple pour montrer le processus en action */
  if (!LS.get(APP.key)) persistNow();

  /* Câblage */
  document.addEventListener("click", e => {
    const back = e.target.closest ? e.target.closest(".modal-back") : null;
    if (back && e.target === back){ closeModal(); return; }
    const el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el) return;
    const tag = el.tagName;
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if (el.tagName === "A") e.preventDefault();
    handleClick(el);
  });
  document.addEventListener("change", e => {
    const el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el) return;
    if (settingsChange(el)) return;
    handleChange(el);
  });
  document.addEventListener("keydown", e => {
    const el = e.target;
    const typing = el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable);
    if (e.key === "Escape"){ closeModal(); return; }
    if (typing) {
      if (e.key === "Enter" && el.dataset && el.dataset.act === "comment-input"){
        const btn = $('[data-act="comment-send"][data-id="' + el.dataset.id + '"]');
        if (btn) handleClick(btn);
      }
      return;
    }
    if (e.key === "n" || e.key === "N"){ if (can("create")) openQuickCapture(); }
    else if (e.key === "/"){ e.preventDefault(); const g = $("#globalSearch"); if (g) g.focus(); }
    else if (/^[1-9]$/.test(e.key)){
      const btns = $$(".sidebar .navbtn");
      const b = btns[Number(e.key)-1];
      if (b) handleClick(b);
    }
  });
  const gs = $("#globalSearch");
  if (gs) gs.addEventListener("input", debounce(function(){ UI.search = this.value.trim(); render(); }, 220));

  /* Changement d'utilisateur courant (équivalent d'une connexion) */
  const us = $("#userSwitch");
  if (us) us.addEventListener("change", function(){
    CFG.currentUser = this.value; saveCfg();
    const u = currentUser();
    toast("Session : " + u.name + " — " + ROLES[u.role].label, "ok");
    render();
  });


  /* Import de fichier */
  document.addEventListener("change", e => {
    if (e.target && e.target.id === "importFile"){
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const mode = ($("#importMode")||{}).value || "replace";
      const rd = new FileReader();
      rd.onload = () => importJson(String(rd.result), mode);
      rd.readAsText(f);
      e.target.value = "";
    }
  });

  /* Écrans */
  $("#app").classList.remove("hidden");
  if (location.hash && location.hash.length > 1){
    const h = location.hash.slice(1);
    if (["dashboard","pipeline","list","matrix","backlog","tasks","reviews","settings","help"].includes(h)) UI.view = h;
  }
  render();
  renderSaveBadge();
  setTimeout(() => {
    if (!LS.available) toast("Aperçu restreint : les données ne seront pas conservées après rechargement. Téléchargez le fichier HTML pour un usage complet.", "warn", 9000);
  }, 1200);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
