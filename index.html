<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boîte à Idées — de l'idée à la réalisation</title>
<style>
/* ============================================================
   Boîte à Idées — feuille de styles (autonome, sans dépendance)
   ============================================================ */
:root{
  --bg:#0d1117; --bg2:#121824; --card:#161d2b; --card2:#1c2434; --card3:#222c3f;
  --line:#27314a; --line2:#323d59;
  --txt:#e7ecf6; --muted:#8f9cb8; --muted2:#6d7994;
  --accent:#6c8cff; --accent2:#a06bff;
  --ok:#34c48d; --warn:#f2b544; --bad:#ff6b6b; --info:#4cc9f0; --orange:#ff9f6b;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --radius:12px; --radius-s:8px;
}
html[data-theme="light"]{
  --bg:#eef1f8; --bg2:#ffffff; --card:#ffffff; --card2:#f6f8fd; --card3:#eef2fa;
  --line:#dfe4f0; --line2:#cdd5e6;
  --txt:#131a26; --muted:#5d6880; --muted2:#7d879c;
  --shadow:0 8px 24px rgba(20,30,60,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:radial-gradient(1200px 700px at 15% -10%, rgba(108,140,255,.16), transparent 60%),
             radial-gradient(900px 600px at 100% 0%, rgba(160,107,255,.14), transparent 55%), var(--bg);
  color:var(--txt); font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Inter",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:650; letter-spacing:-.01em}
a{color:var(--accent); text-decoration:none}
button,input,select,textarea{font:inherit; color:inherit}
::-webkit-scrollbar{height:10px;width:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none !important}

/* ---------- Barre supérieure ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:40; display:flex; align-items:center; gap:14px;
  padding:10px 16px; background:color-mix(in srgb, var(--bg2) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; min-width:210px}
.brand-logo{
  width:34px;height:34px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center; box-shadow:0 6px 16px rgba(108,140,255,.35);
}
.brand-logo svg{width:20px;height:20px}
.brand b{display:block; font-size:15px; line-height:1.15}
.brand span{display:block; font-size:11px; color:var(--muted)}
.search{flex:1; max-width:620px; position:relative}
.search input{
  width:100%; padding:9px 12px 9px 34px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); outline:none;
}
.search input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(108,140,255,.15)}
.search .ico{position:absolute; left:11px; top:9px; color:var(--muted2); font-size:14px}
.topactions{display:flex; align-items:center; gap:8px; margin-left:auto}

/* ---------- Boutons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:9px;
  border:1px solid var(--line2); background:var(--card2); cursor:pointer; white-space:nowrap;
  transition:.15s; font-size:13px; font-weight:550;
}
.btn:hover{background:var(--card3); border-color:var(--accent)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent; color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:linear-gradient(135deg,#2fae7d,#34c48d); border-color:transparent; color:#04231a}
.btn.bad{background:transparent; border-color:var(--bad); color:#ffb0b0}
.btn.bad:hover{background:rgba(255,107,107,.14)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px; font-size:12px; border-radius:7px}
.btn.icon{padding:7px 9px}
.btn.wide{width:100%; justify-content:center}

/* ---------- Structure ---------- */
.layout{display:flex; align-items:flex-start; gap:0; min-height:calc(100vh - 55px)}
.sidebar{
  position:sticky; top:55px; width:228px; flex:0 0 228px; padding:14px 10px 30px;
  border-right:1px solid var(--line); height:calc(100vh - 55px); overflow:auto;
}
.nav-sec{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted2); margin:14px 10px 6px}
.navbtn{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:9px 11px;
  border:0; background:transparent; border-radius:9px; cursor:pointer; color:var(--muted); font-size:13.5px;
}
.navbtn:hover{background:var(--card); color:var(--txt)}
.navbtn.active{background:linear-gradient(90deg, rgba(108,140,255,.20), rgba(160,107,255,.10)); color:var(--txt); font-weight:600}
.navbtn .ic{width:18px; text-align:center; opacity:.9}
.navbtn .cnt{margin-left:auto; background:var(--card3); border:1px solid var(--line2); color:var(--muted);
  font-size:11px; padding:0 6px; border-radius:20px; min-width:20px; text-align:center}
.navbtn.active .cnt{background:rgba(108,140,255,.25); color:var(--txt)}
main{flex:1; min-width:0; padding:20px 22px 70px; max-width:1500px}

/* ---------- En-têtes de page ---------- */
.page-head{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:16px}
.page-title{font-size:22px}
.page-sub{color:var(--muted); font-size:13px; margin-top:2px}
.spacer{flex:1}
.toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap}

/* ---------- Cartes ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.card-head{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line)}
.card-title{font-size:14px; font-weight:650}
.card-body{padding:14px}
.grid{display:grid; gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpi{padding:14px; }
.kpi-lbl{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.kpi-val{font-size:26px; font-weight:700; margin-top:4px; letter-spacing:-.02em}
.kpi-sub{font-size:11.5px; color:var(--muted2); margin-top:2px}

/* ---------- Formulaires ---------- */
label.f{display:block; font-size:12px; color:var(--muted); margin:0 0 5px; font-weight:600}
.input,select.input,textarea.input{
  width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line2);
  background:var(--card2); outline:none;
}
.input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(108,140,255,.14)}
textarea.input{resize:vertical; min-height:70px; line-height:1.55}
.field{margin-bottom:12px}
.field-row{display:grid; gap:12px; grid-template-columns:1fr 1fr}
.field-row-3{display:grid; gap:12px; grid-template-columns:1fr 1fr 1fr}
.hint{font-size:11.5px; color:var(--muted2); margin-top:4px}
.req::after{content:" *"; color:var(--bad)}
input[type=range]{width:100%; accent-color:var(--accent)}
.switch{display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer}
input[type=checkbox],input[type=radio]{accent-color:var(--accent); width:16px; height:16px}

/* ---------- Chips / badges ---------- */
.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:20px;
  border:1px solid var(--line2); background:var(--card2); font-size:11.5px; color:var(--muted); cursor:pointer}
.chip:hover{border-color:var(--accent); color:var(--txt)}
.chip.active{background:rgba(108,140,255,.18); border-color:var(--accent); color:var(--txt); font-weight:600}
.badge{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:6px; font-size:11px;
  font-weight:650; border:1px solid transparent; white-space:nowrap}
.b-ok{background:rgba(52,196,141,.16); color:#62e0b0; border-color:rgba(52,196,141,.35)}
.b-warn{background:rgba(242,181,68,.16); color:#f7cf7f; border-color:rgba(242,181,68,.35)}
.b-bad{background:rgba(255,107,107,.16); color:#ff9e9e; border-color:rgba(255,107,107,.35)}
.b-info{background:rgba(76,201,240,.16); color:#8fdcf7; border-color:rgba(76,201,240,.35)}
.b-acc{background:rgba(108,140,255,.18); color:#a9bdff; border-color:rgba(108,140,255,.4)}
.b-muted{background:var(--card3); color:var(--muted); border-color:var(--line2)}
html[data-theme="light"] .b-ok{color:#0d7a52} html[data-theme="light"] .b-warn{color:#8a5a06}
html[data-theme="light"] .b-bad{color:#b3261e} html[data-theme="light"] .b-info{color:#0a6d8a}
html[data-theme="light"] .b-acc{color:#2f45b8}
.tag{display:inline-block; padding:1px 7px; border-radius:5px; background:var(--card3); border:1px solid var(--line2);
  font-size:11px; color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%; display:inline-block; flex:0 0 auto}
.pill-score{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:20px;
  font-size:11.5px; font-weight:700; border:1px solid var(--line2); background:var(--card2)}

/* ---------- Tableaux ---------- */
.table{width:100%; border-collapse:collapse; font-size:13px}
.table th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted2);
  padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer; user-select:none;
}
.table th:hover{color:var(--txt)}
.table td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
.table tbody tr{cursor:pointer}
.table tbody tr:hover{background:var(--card2)}
.table .t-title{font-weight:600}
.wrap{overflow:auto; border-radius:var(--radius); border:1px solid var(--line); background:var(--card)}

/* ---------- Kanban ---------- */
.kanban{display:flex; gap:12px; overflow-x:auto; padding-bottom:14px; align-items:flex-start}
.kcol{flex:0 0 268px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); min-height:150px}
.kcol.dragover{border-color:var(--accent); background:var(--card2); box-shadow:0 0 0 3px rgba(108,140,255,.13)}
.kcol-head{padding:10px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px}
.kcol-head b{font-size:12.5px}
.kcol-head .cnt{margin-left:auto; font-size:11px; color:var(--muted); background:var(--card3); padding:1px 7px; border-radius:20px}
.kcards{padding:9px; display:flex; flex-direction:column; gap:8px; min-height:60px}
.kcard{background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:10px; cursor:pointer; transition:.13s}
.kcard:hover{border-color:var(--accent); transform:translateY(-1px)}
.kcard.dragging{opacity:.45}
.kcard-top{display:flex; align-items:center; gap:6px; margin-bottom:5px}
.kcard-title{font-weight:600; font-size:13px; line-height:1.35}
.kcard-meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:7px; font-size:11px; color:var(--muted2)}
.kcard-code{font-size:10.5px; color:var(--muted2); font-family:ui-monospace,Menlo,Consolas,monospace}
.kcard-flags{display:flex; gap:5px; margin-left:auto; align-items:center}

/* ---------- Liste / filtres ---------- */
.filters{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px}
.filters .input{width:auto; min-width:150px}
.chips{display:flex; gap:6px; flex-wrap:wrap}

/* ---------- Détail idée ---------- */
.detail-head{display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap}
.dt-title{font-size:21px; line-height:1.25}
.dt-meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; color:var(--muted); font-size:12.5px; margin-top:8px}
.stepper{display:flex; align-items:center; gap:0; margin:16px 0 6px; overflow-x:auto; padding-bottom:6px}
.step{display:flex; align-items:center; gap:7px; flex:0 0 auto}
.step-dot{width:22px;height:22px;border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:700;
  background:var(--card3); border:1px solid var(--line2); color:var(--muted2)}
.step.done .step-dot{background:rgba(52,196,141,.2); border-color:rgba(52,196,141,.5); color:#62e0b0}
.step.current .step-dot{background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent; color:#fff;
  box-shadow:0 0 0 4px rgba(108,140,255,.18)}
.step-lbl{font-size:11.5px; color:var(--muted2); max-width:120px; line-height:1.2}
.step.current .step-lbl{color:var(--txt); font-weight:600}
.step.past .step-lbl{color:var(--muted)}
.step-line{width:26px; height:2px; background:var(--line2); margin:0 8px; flex:0 0 auto}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin:16px 0 16px; overflow-x:auto}
.tab{padding:9px 13px; border:0; background:transparent; cursor:pointer; color:var(--muted); font-size:13px;
  border-bottom:2px solid transparent; white-space:nowrap}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--txt); border-bottom-color:var(--accent); font-weight:600}
.tab .cnt{font-size:11px; color:var(--muted2); margin-left:5px}
.section{margin-bottom:16px}
.sec-head{display:flex; align-items:center; gap:10px; margin-bottom:9px}
.sec-title{font-size:13.5px; font-weight:650}
.kv{display:grid; grid-template-columns:190px 1fr; gap:1px; background:var(--line); border:1px solid var(--line);
  border-radius:10px; overflow:hidden}
.kv>div{background:var(--card); padding:9px 11px; font-size:13px}
.kv .k{color:var(--muted); font-weight:600; font-size:12px}

/* ---------- Questionnement ---------- */
.qitem{border:1px solid var(--line); border-radius:10px; padding:11px 12px; background:var(--card2); margin-bottom:9px}
.qitem.essential{border-left:3px solid var(--accent)}
.qhead{display:flex; gap:8px; align-items:flex-start}
.qtext{font-weight:600; font-size:13px; flex:1}
.qmeta{font-size:11px; color:var(--muted2); margin-top:5px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.qans{margin-top:9px}
.qa-list{margin:0; padding-left:18px}
.qa-list li{margin-bottom:5px}
.li-item{display:flex; gap:9px; align-items:flex-start; padding:9px 11px; border:1px solid var(--line);
  border-radius:9px; background:var(--card2); margin-bottom:8px}
.li-item .li-body{flex:1; min-width:0}
.li-title{font-weight:600; font-size:13px}
.li-sub{font-size:12px; color:var(--muted); margin-top:3px; white-space:pre-wrap}
.mini-txt{font-size:12px; color:var(--muted)}
.empty{padding:26px 16px; text-align:center; color:var(--muted2); font-size:13px}
.empty .big{font-size:26px; display:block; margin-bottom:8px; opacity:.6}

/* ---------- Alertes / activité ---------- */
.alert{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:9px; border:1px solid var(--line);
  background:var(--card2); margin-bottom:8px; cursor:pointer}
.alert:hover{border-color:var(--accent)}
.alert .ai{font-size:15px; line-height:1.2}
.alert.high{border-left:3px solid var(--bad)} .alert.med{border-left:3px solid var(--warn)}
.alert.low{border-left:3px solid var(--info)}
.act-item{display:flex; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:12.5px}
.act-item:last-child{border-bottom:0}
.act-time{color:var(--muted2); font-size:11px; min-width:96px}
.avatar{width:24px;height:24px;border-radius:50%; display:grid; place-items:center; font-size:10.5px; font-weight:700;
  color:#08111f; flex:0 0 auto}

/* ---------- Barres / progression ---------- */
.progress{height:7px; background:var(--card3); border-radius:20px; overflow:hidden}
.progress>i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:20px}
.bar-row{display:grid; grid-template-columns:120px 1fr 46px; gap:9px; align-items:center; margin-bottom:7px; font-size:12.5px}
.bar-track{height:9px; background:var(--card3); border-radius:20px; overflow:hidden}
.bar-track>i{display:block; height:100%; border-radius:20px}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-top:8px}

/* ---------- Modales ---------- */
.modal-back{position:fixed; inset:0; background:rgba(4,7,14,.66); backdrop-filter:blur(3px); z-index:80;
  display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto}
.modal{background:var(--card); border:1px solid var(--line2); border-radius:14px; box-shadow:var(--shadow);
  width:100%; max-width:660px; animation:pop .16s ease-out}
.modal.lg{max-width:900px} .modal.xl{max-width:1120px}
@keyframes pop{from{transform:translateY(-8px) scale(.99); opacity:0}}
.modal-head{display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line)}
.modal-head h3{font-size:15px; flex:1}
.modal-body{padding:16px; max-height:76vh; overflow:auto}
.modal-foot{display:flex; gap:8px; justify-content:flex-end; padding:12px 16px; border-top:1px solid var(--line); flex-wrap:wrap}
.x{background:transparent; border:0; font-size:19px; cursor:pointer; color:var(--muted); line-height:1}
.x:hover{color:var(--txt)}

/* ---------- Toasts ---------- */
#toasts{position:fixed; right:16px; bottom:16px; z-index:120; display:flex; flex-direction:column; gap:8px; max-width:360px}
.toast{background:var(--card); border:1px solid var(--line2); border-left:3px solid var(--accent); border-radius:10px;
  padding:10px 13px; box-shadow:var(--shadow); font-size:13px; animation:pop .15s ease-out}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}

/* ---------- Matrice ---------- */
.matrix-wrap{position:relative; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px}
.matrix svg{width:100%; height:auto; display:block}
.quad-lbl{font-size:11px; fill:var(--muted2); font-weight:600}
.node{cursor:pointer}
.node:hover circle{stroke:var(--txt); stroke-width:2}

/* ---------- Divers ---------- */
.mono{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px}
.nowrap{white-space:nowrap} .center{text-align:center} .right{text-align:right}
.sep{height:1px; background:var(--line); margin:14px 0}
.flex{display:flex; align-items:center; gap:8px} .flex-wrap{flex-wrap:wrap}
.gap4{gap:4px} .gap12{gap:12px} .mt8{margin-top:8px} .mt14{margin-top:14px} .mb8{margin-bottom:8px}
.pad12{padding:12px}
.scroll-y{max-height:420px; overflow:auto}
.gate-item{display:flex; gap:9px; align-items:flex-start; padding:8px 10px; border-radius:8px; background:var(--card2);
  border:1px solid var(--line); margin-bottom:6px; font-size:13px}
.gate-item.ok{border-left:3px solid var(--ok)} .gate-item.ko{border-left:3px solid var(--bad)}
.kbd{font-family:ui-monospace,monospace; font-size:11px; border:1px solid var(--line2); border-bottom-width:2px;
  border-radius:5px; padding:1px 5px; color:var(--muted); background:var(--card2)}
.split{display:grid; grid-template-columns:1.15fr .85fr; gap:14px}
@media (max-width:1050px){ .split{grid-template-columns:1fr} }
@media (max-width:860px){
  .sidebar{display:none} .brand span{display:none} .brand{min-width:0}
  main{padding:14px} .field-row,.field-row-3{grid-template-columns:1fr}
}
.strike{text-decoration:line-through; opacity:.55}
textarea.autosize{min-height:34px}

/* ---------- Impression ---------- */
#printArea{display:none}
@media print{
  body{background:#fff; color:#000}
  #app,#modalRoot,#toasts{display:none !important}
  #printArea{display:block !important; padding:0}
  #printArea h1{font-size:19px} #printArea h2{font-size:14px; margin:16px 0 6px; border-bottom:1px solid #999; padding-bottom:3px}
  #printArea h3{font-size:12.5px; margin:10px 0 4px}
  #printArea .p-meta{font-size:11px; color:#333}
  #printArea table{width:100%; border-collapse:collapse; font-size:11px; margin:6px 0}
  #printArea th,#printArea td{border:1px solid #bbb; padding:4px 6px; text-align:left}
  #printArea .p-block{border:1px solid #bbb; border-radius:6px; padding:8px 10px; margin-bottom:8px; font-size:11.5px; white-space:pre-wrap}
  #printArea .p-lab{font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.04em}
  .p-avoid{break-inside:avoid}
}

const DEFAULT_SETTINGS = {

/* Vocabulaire heuristique pour l'analyse automatique (classement / rangement / étiquetage) */

/* ------------------------------ 1. Utilitaires ------------------------------ */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s===undefined||s===null?"":s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = (p="id") => p + "_" + Math.random().toString(36).slice(2,9);
const nowISO = () => new Date().toISOString();
const today = () => new Date().toISOString().slice(0,10);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const byId = (arr,id) => (arr||[]).find(x => x.id === id) || null;
const clone = o => JSON.parse(JSON.stringify(o));
const sortBy = (arr, fn, dir=1) => arr.slice().sort((a,b) => { const va=fn(a), vb=fn(b); return (va>vb?1:va<vb?-1:0)*dir; });
const uniq = a => Array.from(new Set(a));
const fmtDate = d => d ? new Date(d).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"}) : "—";
const fmtShort = d => d ? new Date(d).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"}) : "—";
const fmtDT = d => d ? new Date(d).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";
function fmtRel(d){
  if(!d) return "—";
  const s = Math.round((Date.now() - new Date(d).getTime())/1000);
  if (s < 60) return "à l'instant";
  const m = Math.round(s/60); if (m < 60) return "il y a " + m + " min";
  const h = Math.round(m/60); if (h < 24) return "il y a " + h + " h";
  const j = Math.round(h/24); if (j < 31) return "il y a " + j + " j";
  const mo = Math.round(j/30); if (mo < 12) return "il y a " + mo + " mois";
  return "il y a " + Math.round(mo/12) + " an(s)";
}
const daysSince = d => d ? Math.floor((Date.now() - new Date(d).getTime())/86400000) : 0;
const money = (n,c) => Number(n||0).toLocaleString("fr-FR",{style:"currency",currency:c||state().settings.currency,maximumFractionDigits:0});
const num = n => Number(n||0).toLocaleString("fr-FR");
const pctStr = n => Math.round(Number(n)||0) + " %";
const initials = n => String(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
function colorOf(str){ // couleur stable dérivée d'une chaîne
  let h = 0; for (let i=0;i<String(str).length;i++) h = (h*31 + String(str).charCodeAt(i)) % 360;
  return "hsl(" + h + ",68%,62%)";
}
function debounce(fn, ms){ let t; return function(){ const a=arguments, c=this; clearTimeout(t); t=setTimeout(()=>fn.apply(c,a), ms); }; }

/* Stockage résilient : localStorage si disponible (mode aperçu sandbox = mémoire) */
const LS = (() => {
  let ok = true;
  try { localStorage.setItem("__bai_test","1"); localStorage.removeItem("__bai_test"); } catch(e){ ok = false; }
  const mem = {};
  return {
    available: ok,
    get(k){ if(ok){ try { return localStorage.getItem(k); } catch(e){} } return (k in mem) ? mem[k] : null; },
    set(k,v){ if(ok){ try { localStorage.setItem(k,v); } catch(e){} } mem[k]=v; },
    remove(k){ if(ok){ try { localStorage.removeItem(k); } catch(e){} } delete mem[k]; }
  };
})();

/* ------------------------------ 2. État & persistance ------------------------------ */
let STATE = null;
let CFG = { theme:"dark", mode:"local", serverUrl:"", currentUser:null, nav:"dashboard", filters:{} };
let UI = { view:"dashboard", ideaId:null, tab:"synthese", search:"", error:null };
let SAVE_INFO = { lastSave:null, status:"local", pending:false, version:0, conflict:false };

function state(){ return STATE; }
function settings(){ return STATE.settings; }
function stageDef(id){ return byId(settings().pipeline, id); }
function stageIndex(id){ return settings().pipeline.findIndex(s => s.id === id); }
function stageNext(id){ const p = settings().pipeline, i = stageIndex(id); return (i>=0 && i<p.length-1) ? p[i+1] : null; }
function stagePrev(id){ const p = settings().pipeline, i = stageIndex(id); return (i>0) ? p[i-1] : null; }
function isProjectStage(id){ const s = stageDef(id); return !!(s && s.phase === "projet"); }
function ideas(){ return STATE.ideas; }
function idea(id){ return byId(STATE.ideas, id); }
function user(id){ return byId(STATE.users, id); }
function currentUser(){ return user(CFG.currentUser) || STATE.users[0]; }
function can(cap){ const u = currentUser(); return !!(u && ROLES[u.role] && ROLES[u.role].caps.includes(cap)); }
function canForce(){ const u = currentUser(); return !!u && (u.role === "admin" || u.role === "validateur"); }
function roleOf(u){ return ROLES[(u||currentUser()).role]; }

    meta:{ schema:APP.schema, createdAt:nowISO(), updatedAt:nowISO(), version:0, org:"Boîte à Idées de D'ji" },

    ideas:[],
    activity:[],

function nextCode(){

  return "IDE-" + y + "-" + String(n).padStart(4,"0");

function logAct(type, text, ref){

  if (STATE.activity.length > 800) STATE.activity.length = 800;

const persist = debounce(function(){
  STATE.meta.updatedAt = nowISO();
  const json = JSON.stringify(STATE);
  try { LS.set(APP.key, json); } catch(e){ toast("Sauvegarde locale impossible (quota ?)","bad"); }
  SAVE_INFO.lastSave = nowISO();
  if (CFG.mode === "server" && CFG.serverUrl) pushServer(json);
  renderSaveBadge();
}, 400);

const persistNow = function(){
  STATE.meta.updatedAt = nowISO();
  const json = JSON.stringify(STATE);
  LS.set(APP.key, json);
  SAVE_INFO.lastSave = nowISO();
  if (CFG.mode === "server" && CFG.serverUrl) pushServer(json);
  renderSaveBadge();
};

/* Mode serveur : synchronisation de l'état complet (contrat minimal documenté dans le README) */
function pushServer(json){
  if (!CFG.serverUrl) return;
  SAVE_INFO.status = "sync";
  fetch(CFG.serverUrl.replace(/\/$/,"") + "/api/state", {
    method:"PUT", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ state: JSON.parse(json), baseVersion: SAVE_INFO.version })
  }).then(r => {
    if (r.status === 409) { SAVE_INFO.conflict = true; SAVE_INFO.status = "conflit"; toast("Conflit de version côté serveur : rechargez la page.","bad"); renderSaveBadge(); return null; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(res => {
    if (!res) return;

function migrate(s){
  s.settings = Object.assign(clone(DEFAULT_SETTINGS), s.settings || {});
  s.settings.pipeline = (s.settings.pipeline && s.settings.pipeline.length) ? s.settings.pipeline : clone(DEFAULT_PIPELINE);

/* ------------------------------ 3. Modèle d'une idée ------------------------------ */
function emptyIdea(){
  return {
    id:uid("idea"), code:"", title:"", description:"", author:null, category:"", tags:[], urgency:"moyenne",
    stage:"capture", status:"active", favorite:false,
    createdAt:nowISO(), updatedAt:nowISO(),
    auto:{ suggestion:null, runAt:null },
    answers:{},
    analysis:{ hypotheses:[], problems:[], solutions:[], risks:[], kpis:[] },
    scoring:{ values:{}, score:0, bucket:"C", quadrant:"" },
    decision:{ verdict:null, rationale:"", conditions:"", by:null, at:null },
    park:{ reason:"", reviewAt:"", conditions:"", by:null, at:null },
    project:{
      promotedAt:null, objectives:"", scopeIn:"", scopeOut:"", resources:"",
      deliverables:[], stakeholders:[],
      budget:{ lines:[], expectedValue:0, roiNotes:"" },
      milestones:[], tasks:[], reviews:[], progress:0,
      bilan:{ deliveredAt:"", results:"", kpis:[], lessons:[], followUps:"" }
    },
    comments:[], history:[], stageLog:[]
  };
}
function normalizeIdea(i){
  const base = emptyIdea();
  for (const k in base) if (!(k in i)) i[k] = base[k];
  i.analysis = Object.assign(clone(base.analysis), i.analysis || {});
  i.scoring  = Object.assign(clone(base.scoring),  i.scoring  || {});
  i.decision = Object.assign(clone(base.decision), i.decision || {});
  i.park     = Object.assign(clone(base.park),     i.park     || {});
  i.project  = Object.assign(clone(base.project),  i.project  || {});
  i.project.budget = Object.assign(clone(base.project.budget), i.project.budget || {});
  i.project.bilan  = Object.assign(clone(base.project.bilan),  i.project.bilan  || {});
  i.answers = i.answers || {}; i.tags = i.tags || []; i.history = i.history || []; i.stageLog = i.stageLog || [];
  i.comments = i.comments || [];
  return i;
}
function addHistory(i, type, text){
  i.history.unshift({ at:nowISO(), by:currentUser() ? currentUser().id : null, type, text });
  if (i.history.length > 300) i.history.length = 300;
}
function touch(i){ i.updatedAt = nowISO(); }

/* ------------------------------ 4. Cycle de vie ------------------------------ */
function createIdea(fields){
  const i = normalizeIdea(Object.assign(emptyIdea(), fields || {}));
  i.code = nextCode();
  i.author = i.author || (currentUser() ? currentUser().id : null);
  i.createdAt = nowISO(); i.updatedAt = nowISO();
  i.stageLog.push({ stage:i.stage, at:nowISO(), by:i.author });
  if (!i.category && i.auto.suggestion) i.category = i.auto.suggestion.category || "";
  STATE.ideas.unshift(i);
  addHistory(i,"création","Idée capturée à l'étape « " + (stageDef(i.stage)||{}).label + " »");
  logAct("création", "Nouvelle idée " + i.code + " : " + (i.title||"(sans titre)"), i.id);
  pullQuestions(i);
  persist();
  return i;
}
function ensureQuestionsUpTo(i){   // garantit la présence du questionnement de toutes les étapes traversées
  let added = 0;
  const upto = stageIndex(i.stage);
  settings().pipeline.forEach((sd, idx) => {
    if (idx > upto || !sd.questions) return;
    (settings().questions[sd.questions] || []).forEach(q => {
      if (!i.answers[q.id]) { i.answers[q.id] = { text:q.text, essential:!!q.essential, answer:"", status:"à répondre", by:null, at:null, stage:sd.id, custom:false }; added++; }
    });
  });
  return added;
}
function pullQuestions(i){
  const s = stageDef(i.stage);
  if (!s || !s.questions) return 0;
  const tpl = settings().questions[s.questions] || [];
  let added = 0;
  tpl.forEach(q => {
    if (!i.answers[q.id]) { i.answers[q.id] = { text:q.text, essential:!!q.essential, answer:"", status:"à répondre", by:null, at:null, stage:s.id, custom:false }; added++; }
  });
  return added;
}
function openStageQuestionnaires(i){ // à l'entrée dans une étape : ajoute le questionnement correspondant
  settings().pipeline.forEach(s => { if (s.questions) { /* rien : on ajoute seulement l'étape courante */ } });
  return pullQuestions(i);
}
function enterStage(i, targetId, opts){
  opts = opts || {};
  const from = stageDef(i.stage);
  const to = stageDef(targetId);
  if (!to) return false;
  const idx = stageIndex(targetId);
  const cur = stageIndex(i.stage);
  const direction = idx > cur ? "avant" : "arrière";
  const curLog = i.stageLog[i.stageLog.length - 1];
  if (curLog && !curLog.exitAt) { curLog.exitAt = nowISO(); curLog.durationDays = daysSince(curLog.at); }
  i.stageLog.push({ stage:targetId, at:nowISO(), by:currentUser() ? currentUser().id : null, forced:!!opts.force, note:opts.note||"" });
  i.stage = targetId;
  if (to.phase === "projet" && !i.project.promotedAt) i.project.promotedAt = nowISO();
  ensureQuestionsUpTo(i);
  const added = pullQuestions(i);
  addHistory(i, "étape", "Passage " + direction + " : " + (from?from.label:"?") + " → " + to.label + (opts.force ? " (passage forcé : " + (opts.note||"sans motif") + ")" : ""));
  logAct("étape", (i.code) + " — " + (from?from.label:"?") + " → " + to.label, i.id);
  if (added) toast(added + " question(s) ajoutée(s) au questionnement.", "ok");
  touch(i); persist();
  return true;
}
function reorderStageUsage(){ /* réservé : réordonnancement global du pipeline */ }

/* --- Portes de passage (gates) --- */
const GATE_TESTS = {
  hasTitle:        { label:"Un titre explicite est renseigné",                 test:i => (i.title||"").trim().length >= 4 },
  descLong:        { label:"Description détaillée (au moins 80 caractères)",   test:i => (i.description||"").trim().length >= 80 },
  hasCategory:     { label:"Une catégorie est attribuée",                      test:i => !!i.category },
  hasTags:         { label:"Au moins un mot-clé (tag) est associé",            test:i => (i.tags||[]).length > 0 },
  answeredEssential:{ label:"Toutes les questions essentielles ont une réponse", test:i => essentialPending(i) === 0 },
  hasHypotheses:   { label:"Au moins une hypothèse est documentée",            test:i => (i.analysis.hypotheses||[]).length > 0 },
  hasSolutions:    { label:"Au moins une solution est proposée",               test:i => (i.analysis.solutions||[]).length > 0 },
  hasRisks:        { label:"Au moins un risque est identifié",                 test:i => (i.analysis.risks||[]).length > 0 },
  scored:          { label:"Tous les critères de scoring sont notés",          test:i => activeCriteria().every(c => i.scoring.values[c.id] !== undefined && i.scoring.values[c.id] !== "") },
  hasDecision:     { label:"Une décision (GO / NO-GO / à revoir) est prise et justifiée", test:i => !!i.decision.verdict && (i.decision.rationale||"").trim().length >= 10 },
  hasObjectives:   { label:"Les objectifs du projet sont écrits",              test:i => (i.project.objectives||"").trim().length >= 20 },
  hasScope:        { label:"Le périmètre (inclus / exclu) est défini",         test:i => (i.project.scopeIn||"").trim().length > 0 && (i.project.scopeOut||"").trim().length > 0 },
  hasDeliverables: { label:"Au moins un livrable est listé",                   test:i => (i.project.deliverables||[]).length > 0 },
  hasMilestones:   { label:"Au moins un jalon est planifié avec une date",     test:i => (i.project.milestones||[]).some(m => !!m.due) },
  hasTasks:        { label:"Au moins une tâche est créée",                     test:i => (i.project.tasks||[]).length > 0 },
  hasBudget:       { label:"Le budget estimé est renseigné",                   test:i => (i.project.budget.lines||[]).length > 0 },
  hasProgress:     { label:"L'avancement est suivi (au moins une tâche démarrée)", test:i => (i.project.tasks||[]).some(t => t.status !== "à faire") },
  hasReview:       { label:"Au moins une revue / recette est consignée",       test:i => (i.project.reviews||[]).length > 0 },
  hasBilan:        { label:"Le bilan (résultats et leçons) est rempli",        test:i => (i.project.bilan.results||"").trim().length > 10 && (i.project.bilan.lessons||[]).length > 0 }
};
function activeCriteria(){ return settings().criteria.filter(c => c.active); }
function essentialPending(i){
  return Object.keys(i.answers).filter(k => i.answers[k].essential && i.answers[k].status === "à répondre").length;
}
/* Conditions de passage : travail attendu DANS l'étape en cours avant de pouvoir avancer.
   gateCheck(i, targetId) évalue le travail de l'étape courante ; targetId ne sert qu'aux libellés. */
function gateCheck(i, targetId){
  const cur = stageDef(i.stage), to = targetId ? stageDef(targetId) : stageNext(i.stage);
  if (!cur) return { ok:false, items:[], from:null, to:to };
  const items = (cur.gate||[]).map(g => ({ key:g, label:(GATE_TESTS[g]||{label:g}).label, ok: !!(GATE_TESTS[g] && GATE_TESTS[g].test(i)) }));
  return { ok: items.every(it => it.ok), items, from:cur, to:to };
}
function stageWork(i){ return (stageDef(i.stage)||{gate:[]}).gate || []; }

/* ------------------------------ 5. Scoring & classement automatique ------------------------------ */
function computeScore(i){
  const crit = activeCriteria();
  let num = 0, den = 0, filled = 0;
  crit.forEach(c => {
    const raw = i.scoring.values[c.id];
    if (raw === undefined || raw === "" || raw === null) return;
    filled++;
    const v = clamp(Number(raw), 1, 5);
    const norm = (v - 1) / 4;              // 0 → 1
    const value = c.inverse ? (1 - norm) : norm;
    num += value * c.weight; den += c.weight;
  });
  const rate = crit.length ? filled / crit.length : 0;
  const score = den ? Math.round((num / den) * 100) : 0;
  return { score, filled, total:crit.length, rate };
}
function bucketOf(score){
  const s = settings();
  if (score >= s.bucketA) return "A";
  if (score >= s.bucketB) return "B";
  if (score >= s.bucketC) return "C";
  return "D";
}
const BUCKETS = {
  A:{ label:"Priorité A", cls:"b-ok",   hint:"À lancer dès que possible" },
  B:{ label:"Priorité B", cls:"b-info", hint:"À planifier ce trimestre" },
  C:{ label:"Priorité C", cls:"b-warn", hint:"À garder au backlog" },
  D:{ label:"Priorité D", cls:"b-bad",  hint:"À retravailler ou écarter" }
};
function quadrantOf(i){
  const imp = Number(i.scoring.values.impact || 0), eff = Number(i.scoring.values.effort || 0);
  if (!imp || !eff) return null;
  if (imp >= 3.5 && eff <= 2.5) return { id:"qw", label:"Quick win",       cls:"b-ok",   hint:"Fort impact, faible effort → à faire tout de suite" };
  if (imp >= 3.5 && eff >  2.5) return { id:"gp", label:"Grand projet",    cls:"b-acc",  hint:"Fort impact, fort effort → à planifier" };
  if (imp <  3.5 && eff <= 2.5) return { id:"pl", label:"Petit plus",      cls:"b-info", hint:"Faible impact, faible effort → si le temps le permet" };
  return { id:"ev", label:"À écarter / revoir", cls:"b-bad", hint:"Faible impact, fort effort → à retravailler" };
}
function refreshScoring(i){
  const r = computeScore(i);
  i.scoring.score = r.score;
  i.scoring.bucket = bucketOf(r.score);
  const q = quadrantOf(i); i.scoring.quadrant = q ? q.id : "";
  return r;
}
function rankedIdeas(){ // rang automatique : score décroissant, puis ancienneté
  return sortBy(ideas().filter(i => i.status === "active"), i => [i.scoring.score, -new Date(i.createdAt).getTime()], -1);
}
function rankOf(id){
  const list = rankedIdeas();
  const i = list.findIndex(x => x.id === id);
  return { rank: i+1, total: list.length };
}
function dormantDays(i){ return daysSince(i.updatedAt); }
function isDormant(i){ return i.status === "active" && !isTerminalStage(i.stage) && dormantDays(i) >= settings().dormantDays; }
function isTerminalStage(id){ const p = settings().pipeline; return stageIndex(id) === p.length-1; }
function projectProgress(i){
  const t = i.project.tasks || [];
  if (!t.length) return Number(i.project.progress||0);
  const done = t.reduce((s,x) => s + (x.status === "terminée" ? 1 : (x.status === "en cours" ? 0.5 : 0)), 0);
  return Math.round((done / t.length) * 100);
}
function budgetTotals(i){
  const lines = i.project.budget.lines || [];
  const est = lines.reduce((s,l) => s + Number(l.estimated||0), 0);
  const real = lines.reduce((s,l) => s + Number(l.actual||0), 0);
  const value = Number(i.project.budget.expectedValue||0);
  const gap = est ? Math.round(((real - est)/est)*100) : 0;
  const roi = est ? Math.round(((value - real) / Math.max(real || est,1)) * 100) : 0;
  return { est, real, value, gap, roi };
}

/* ------------------------------ 6. Analyse & classification automatiques ------------------------------ */
function analyseText(text){
  const t = (" " + String(text||"").toLowerCase() + " ").replace(/[’']/g,"’");
  const hits = kw => kw.filter(k => t.includes(k));
  let best = null;
  AUTO_HINTS.categories.forEach(c => { const h = hits(c.kw); if (h.length && (!best || h.length > best.hits.length)) best = { category:c.cat, hits:h }; });
  const tags = [];
  AUTO_HINTS.tags.forEach(g => { if (hits(g.kw).length) tags.push(g.t); });
  let urgency = "moyenne";
  for (const u of AUTO_HINTS.urgency){ if (hits(u.kw).length) { urgency = u.level; break; } }
  let effort = 0; AUTO_HINTS.effort.forEach(e => { if (hits(e.kw).length) effort += e.sign; });
  const words = String(text||"").trim().split(/\s+/).length;
  return {
    category: best ? best.category : "",
    tags: uniq(tags).slice(0,5),
    urgency,
    effortHint: effort > 0 ? "faible" : effort < 0 ? "élevé" : "moyen",
    words,
    runAt: nowISO()
  };
}
function applySuggestion(i, sug){
  if (!sug) return;
  if (sug.category && !i.category) i.category = sug.category;
  i.tags = uniq((i.tags||[]).concat(sug.tags||[]));
  if (sug.urgency) i.urgency = sug.urgency;
  i.auto.suggestion = sug; i.auto.applied = true;
  touch(i);
}

function guard(cap, silent){

  return false;
}

/* ------------------------------ 8. Statistiques ------------------------------ */
function stats(){
  const list = ideas();
  const active = list.filter(i => i.status === "active");
  const projects = active.filter(i => isProjectStage(i.stage));
  const parked = list.filter(i => i.status === "parkee");
  const rejected = list.filter(i => i.status === "rejetee");
  const archived = list.filter(i => i.status === "archivee");
  const validated = list.filter(i => !!i.decision.verdict);
  const go = list.filter(i => i.decision.verdict === "go");
  const byStage = {};
  settings().pipeline.forEach(s => byStage[s.id] = active.filter(i => i.stage === s.id).length);
  const byCat = {};
  list.forEach(i => { const c = i.category || "Non classée"; byCat[c] = (byCat[c]||0)+1; });
  const avgScore = active.length ? Math.round(active.reduce((s,i) => s + i.scoring.score, 0)/active.length) : 0;
  let budget = 0, real = 0;
  projects.forEach(i => { const b = budgetTotals(i); budget += b.est; real += b.real; });
  const tasksLate = projects.reduce((s,i) => s + (i.project.tasks||[]).filter(t => t.due && t.status !== "terminée" && t.due < today()).length, 0);
  const tasksMine = active.reduce((s,i) => s + (i.project.tasks||[]).filter(t => t.assignee === (currentUser()||{}).id && t.status !== "terminée").length, 0);
  const dormant = active.filter(isDormant);
  const awaiting = active.filter(i => i.stage === "validation");
  const milestonesLate = [];
  projects.forEach(i => (i.project.milestones||[]).forEach(m => { if (m.due && m.status !== "atteint" && m.due < today()) milestonesLate.push({ idea:i, m }); }));
  const conversion = list.length ? Math.round((go.length / list.length) * 100) : 0;
  return { list, active, projects, parked, rejected, archived, validated, go, byStage, byCat, avgScore,
           budget, real, tasksLate, tasksMine, dormant, awaiting, milestonesLate, conversion };
}

function stageBadge(stageId, small){

function scorePill(i){

         '<span style="color:' + bucketColor(i.scoring.score) + '">' + i.scoring.score + '</span>/100</span>';
}
function bucketColor(score){
  const s = settings();
  if (score >= s.bucketA) return "#34c48d";
  if (score >= s.bucketB) return "#4cc9f0";
  if (score >= s.bucketC) return "#f2b544";
  return "#ff6b6b";
}
function statusBadge(i){

function avatar(name, size){
  const s = size || 24;
  return '<span class="avatar" style="width:' + s + 'px;height:' + s + 'px;background:' + colorOf(name) + '" title="' + esc(name) + '">' + esc(initials(name)) + '</span>';
}
function tagsHtml(tags, cls){
  return (tags||[]).map(t => '<span class="tag ' + (cls||"") + '">' + esc(t) + '</span>').join(" ");
}
function emptyBox(txt, icon){
  return '<div class="empty"><span class="big">' + (icon||"◌") + '</span>' + esc(txt) + '</div>';
}
function progressBar(p){
  return '<div class="progress"><i style="width:' + clamp(p,0,100) + '%"></i></div>';
}
function donut(parts, size){
  size = size || 156;
  const total = parts.reduce((s,p) => s + p.value, 0) || 1;
  const r = size/2 - 14, cx = size/2, cy = size/2, sw = 20;
  const circ = 2 * Math.PI * r;
  let off = 0, segs = "";
  parts.filter(p => p.value > 0).forEach(p => {
    const len = (p.value/total) * circ;
    segs += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + p.color + '" stroke-width="' + sw + '" ' +
            'stroke-dasharray="' + len + ' ' + (circ-len) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')" />';
    off += len;
  });
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '">' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="rgba(130,150,190,.18)" stroke-width="' + sw + '" />' +
    segs +
    '<text x="' + cx + '" y="' + (cy-2) + '" text-anchor="middle" fill="currentColor" font-size="22" font-weight="700">' + total + '</text>' +
    '<text x="' + cx + '" y="' + (cy+15) + '" text-anchor="middle" fill="rgba(140,155,185,.9)" font-size="10">au total</text></svg>';
}
function barList(rows, colorFn){
  const max = Math.max.apply(null, rows.map(r => r.value).concat([1]));
  return rows.map(r => '<div class="bar-row"><span class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r.label) + '</span>' +
    '<span class="bar-track"><i style="width:' + Math.round(r.value/max*100) + '%;background:' + (colorFn ? colorFn(r) : "linear-gradient(90deg,var(--accent),var(--accent2))") + '"></i></span>' +
    '<b class="right">' + r.value + '</b></div>').join("");
}

function kpi(label, val, sub, tone){

  return '<div class="card kpi"><div class="kpi-lbl">' + esc(label) + '</div><div class="kpi-val" style="color:' + c + '">' + val + '</div>' +
         (sub ? '<div class="kpi-sub">' + sub + '</div>' : "") + '</div>';
}
function buildAlerts(s){
  const a = [];
  s.awaiting.forEach(i => a.push({ level:"high", icon:"✔", txt:i.code + " — « " + i.title + " » attend une décision de validation", id:i.id, action:"Décider" }));
  s.milestonesLate.forEach(x => a.push({ level:"high", icon:"⌛", txt:x.idea.code + " — jalon « " + x.m.title + " » en retard (échéance " + fmtShort(x.m.due) + ")", id:x.idea.id, action:"Ouvrir" }));
  s.dormant.forEach(i => a.push({ level:"med", icon:"❄", txt:i.code + " — « " + i.title + " » sans activité depuis " + dormantDays(i) + " jours", id:i.id, action:"Relancer ou parquer" }));
  s.active.filter(i => i.stage === "evaluation").forEach(i => a.push({ level:"low", icon:"★", txt:i.code + " — scoring à finaliser pour le classement automatique", id:i.id, action:"Noter" }));
  s.projects.forEach(i => { const p = projectProgress(i); const tasks = (i.project.tasks||[]).filter(t => t.due && t.status !== "terminée" && t.due < today());
    if (tasks.length) a.push({ level:"med", icon:"⏱", txt:i.code + " — " + tasks.length + " tâche(s) en retard", id:i.id, action:"Voir" });
    if (p === 100 && i.stage !== "realisation") a.push({ level:"low", icon:"◈", txt:i.code + " — avancement à 100 %, prêt pour la revue / clôture", id:i.id, action:"Ouvrir" });
  });
  s.parked.filter(i => i.park.reviewAt && i.park.reviewAt <= today()).forEach(i => a.push({ level:"med", icon:"↻", txt:i.code + " — parquée, date de réexamen atteinte (" + fmtShort(i.park.reviewAt) + ")", id:i.id, action:"Réexaminer" }));
  return a.slice(0,14);
}

/* ---------------------------- 10.2 Pipeline (kanban) ---------------------------- */
function matchesSearch(i, q){
  if (!q) return true;
  q = q.toLowerCase();
  const hay = [i.title, i.description, i.code, i.category, (i.tags||[]).join(" "), i.project.objectives,
    Object.keys(i.answers).map(k => i.answers[k].text + " " + i.answers[k].answer).join(" "),
    (i.analysis.solutions||[]).map(s => s.title + " " + s.text).join(" ")].join(" ").toLowerCase();
  return hay.includes(q);
}
function filteredIdeas(opts){
  opts = opts || {};
  const f = UI.filters || {};
  let list = ideas().slice();
  if (opts.status === undefined ? f.status !== "all" : false) list = list.filter(i => i.status === "active");
  if (f.status && f.status !== "active" && f.status !== "all") list = ideas().filter(i => i.status === f.status);
  if (f.cat) list = list.filter(i => i.category === f.cat);
  if (f.tag) list = list.filter(i => (i.tags||[]).includes(f.tag));
  if (f.author) list = list.filter(i => i.author === f.author);
  if (f.phase) list = list.filter(i => (stageDef(i.stage)||{}).phase === f.phase);
  if (UI.search) list = list.filter(i => matchesSearch(i, UI.search));
  return list;
}
function viewPipeline(){
  const active = filteredIdeas();
  const cols = settings().pipeline.map(p => {
    const items = active.filter(i => i.stage === p.id);
    const sorted = sortBy(items, i => i.scoring.score, -1);
    return '<div class="kcol" data-drop="' + p.id + '">' +
      '<div class="kcol-head"><span class="dot" style="background:' + p.color + '"></span><b>' + esc(p.label) + '</b>' +
        '<span class="cnt">' + sorted.length + '</span></div>' +

        (can("create") ? "Déposez une idée ici" : "—") + '</div>') + '</div></div>';
  }).join("");
  return '' +
  '<div class="page-head"><div><h1 class="page-title">Pipeline</h1>' +
    '<div class="page-sub">Glissez-déposez une carte pour la faire avancer · les portes de passage sont vérifiées automatiquement</div></div>' +
    '<div class="spacer"></div><div class="toolbar"><button class="btn primary" data-act="quick">＋ Capturer une idée</button>' +
    '<button class="btn" data-act="nav" data-nav="list">Vue liste</button></div></div>' +
  filterBar() +
  '<div class="kanban">' + cols + '</div>';
}
function kcard(i){
  const q = quadrantOf(i);
  const r = rankOf(i.id);
  const late = (i.project.tasks||[]).some(t => t.due && t.status !== "terminée" && t.due < today());
  return '<div class="kcard" draggable="true" data-id="' + i.id + '" data-act="open">' +
    '<div class="kcard-top"><span class="kcard-code">' + esc(i.code) + '</span>' +
      '<span class="kcard-flags">' +
      (isDormant(i) ? '<span class="badge b-warn" title="Sans activité depuis ' + dormantDays(i) + ' jours">❄</span>' : '') +
      (late ? '<span class="badge b-bad" title="Tâches en retard">⏱</span>' : '') +
      (i.favorite ? '<span title="Suivie">★</span>' : '') +
      '<span class="pill-score">' + i.scoring.score + '</span></span></div>' +
    '<div class="kcard-title">' + esc(i.title || "(sans titre)") + '</div>' +
    '<div class="kcard-meta">' +
      (i.category ? '<span class="badge b-muted">' + esc(i.category) + '</span>' : '') +
      (q ? '<span class="badge ' + q.cls + '">' + q.label + '</span>' : '') +
      (r.rank ? '<span title="Rang du portefeuille">#' + r.rank + '</span>' : '') +
      '<span>' + avatar((user(i.author)||{}).name || "?") + '</span>' +
    '</div>' +
    ((i.tags||[]).length ? '<div class="kcard-meta">' + tagsHtml(i.tags.slice(0,3)) + '</div>' : '') +
  '</div>';
}
function filterBar(){
  const f = UI.filters || {}, s = settings();
  const cats = uniq(ideas().map(i => i.category).filter(Boolean)).concat(s.categories.filter(c => !ideas().some(i => i.category === c)));

  return '<div class="filters">' +
    '<span class="tiny muted">Statut</span>' +
    ['active:Actives','all:Toutes','parkee:Parquées','rejetee:Sans suite','archivee:Archivées'].map(x => {

      return '<button class="chip' + ((f.status||"active") === v ? " active" : "") + '" data-act="filter" data-k="status" data-v="' + v + '">' + l + '</button>';

    '<select class="input" data-act="filter-sel" data-k="tag"><option value="">Tous les tags</option>' +

    (UI.search ? '<button class="chip active" data-act="clear-search">Recherche : « ' + esc(UI.search) + ' » ✕</button>' : '') +
    '<div class="spacer"></div><span class="tiny muted">' + filteredIdeas().length + ' idée(s) affichée(s)</span>' +
  '</div>';

/* ---------------------------- 10.4 Matrice impact / effort ---------------------------- */
function viewMatrix(){
  const list = filteredIdeas().filter(i => i.scoring.values.impact && i.scoring.values.effort);
  const W = 760, H = 470, pad = 54;
  const x = v => pad + ((clamp(v,1,5)-1)/4) * (W - pad - 30);
  const y = v => H - pad - ((clamp(v,1,5)-1)/4) * (H - pad - 30);
  const mid = 3;
  const nodes = list.map(i => {
    const eff = Number(i.scoring.values.effort), imp = Number(i.scoring.values.impact);
    const r = 9 + Math.round(i.scoring.score/100 * 15);
    const cx = x(eff), cy = y(imp);
    return '<g class="node" data-act="open" data-id="' + i.id + '">' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + colorOf(i.category || i.title) + '55" stroke="' + colorOf(i.category || i.title) + '" stroke-width="2"/>' +
      '<text x="' + cx + '" y="' + (cy+4) + '" text-anchor="middle" font-size="10" fill="currentColor" style="pointer-events:none">' + i.scoring.score + '</text>' +
      '<text x="' + cx + '" y="' + (cy + r + 12) + '" text-anchor="middle" font-size="10" fill="rgba(140,155,185,.95)" style="pointer-events:none">' + esc((i.title||"").slice(0,24)) + '</text>' +
    '</g>';
  }).join("");
  const midX = x(mid + 0.5), midY = y(mid + 0.5);
  return '' +
  '<div class="page-head"><div><h1 class="page-title">Matrice impact / effort</h1>' +
    '<div class="page-sub">Positionnement automatique selon les notes « Impact » et « Effort » — la taille des bulles reflète le score pondéré</div></div>' +
    '<div class="spacer"></div><div class="toolbar"><button class="btn primary" data-act="quick">＋ Idée</button></div></div>' +
  filterBar() +
  '<div class="matrix-wrap"><div class="matrix"><svg viewBox="0 0 ' + W + ' ' + H + '">' +
    '<rect x="' + pad + '" y="' + pad + '" width="' + (midX-pad) + '" height="' + (midY-pad) + '" fill="rgba(52,196,141,.07)"/>' +
    '<rect x="' + midX + '" y="' + pad + '" width="' + (W-pad-30-midX) + '" height="' + (midY-pad) + '" fill="rgba(108,140,255,.07)"/>' +
    '<rect x="' + pad + '" y="' + midY + '" width="' + (midX-pad) + '" height="' + (H-pad-midY) + '" fill="rgba(76,201,240,.06)"/>' +
    '<rect x="' + midX + '" y="' + midY + '" width="' + (W-pad-30-midX) + '" height="' + (H-pad-midY) + '" fill="rgba(255,107,107,.06)"/>' +

  return '' +
  '<div class="page-head"><div><h1 class="page-title">Backlog &amp; idées en attente de développement</h1>' +
    '<div class="page-sub">Tout ce qui est rangé, classé et conservé en attente : réexaminez régulièrement pour ne rien perdre</div></div>' +

      parked.map(i => '<tr data-act="open" data-id="' + i.id + '"><td><div class="t-title">' + esc(i.title) + '</div><div class="tiny muted">' + esc(i.code) + ' · score ' + i.scoring.score + '</div></td>' +

function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); }

/* ---------------------------- 10.7 Revue du portefeuille ---------------------------- */
function viewReviews(){
  const s = stats();
  const active = sortBy(s.active, i => i.scoring.score, -1);
  const recos = [];
  active.forEach(i => {
    const nx = stageNext(i.stage);
    if (!nx) return;
    const g = gateCheck(i, nx.id);
    if (g.ok) recos.push({ i, nx, txt:"Toutes les conditions sont réunies pour passer à « " + nx.label + " »" });
    else recos.push({ i, nx, txt:g.items.filter(x => !x.ok).length + " condition(s) manquante(s) pour « " + nx.label + " »" });
  });
  return '' +
  '<div class="page-head"><div><h1 class="page-title">Revue du portefeuille</h1>' +
    '<div class="page-sub">Vue de pilotage : classement, maturité, blocages et décisions à prendre</div></div>' +
    '<div class="spacer"></div><div class="toolbar"><button class="btn" data-act="export-csv">⤓ CSV</button>' +
    '<button class="btn" data-act="export-json">⤓ Sauvegarde</button><button class="btn primary" data-act="quick">＋ Idée</button></div></div>' +

  '<div class="grid kpis" style="margin-bottom:16px">' +
    kpi("Idées captées", s.list.length, "depuis le " + fmtDate(STATE.meta.createdAt)) +

    kpi("En phase projet", s.projects.length, "validées et lancées") +
    kpi("Parquées / sans suite", s.parked.length + s.rejected.length, "conservées et traçables") +
    kpi("Idées dormantes", s.dormant.length, "sans activité depuis " + settings().dormantDays + " jours ou plus", s.dormant.length ? "warn" : "ok") +
  '</div>' +

  '<div class="card" style="margin-bottom:16px"><div class="card-head"><div class="card-title">Classement complet du portefeuille actif</div>' +
   '<div class="spacer"></div><span class="tiny muted">' + active.length + ' élément(s) · tri automatique par score pondéré</span></div>' +
   '<div class="card-body" style="padding:0"><div class="wrap" style="border:0"><table class="table"><thead><tr>' +
   '<th>Rang</th><th>Idée / projet</th><th>Étape</th><th>Progression processus</th><th>Score</th><th>Priorité</th><th>Prochaine étape</th><th>État</th><th>Temps dans l\'étape</th></tr></thead><tbody>' +
   (active.length ? active.map((i,idx) => {
      const nx = stageNext(i.stage);

      const log = i.stageLog[i.stageLog.length-1];
      const dt = log ? daysSince(log.at) : 0;
      const dec = i.decision.verdict === "go" ? '<span class="badge b-ok">GO</span>' :
                  i.decision.verdict === "nogo" ? '<span class="badge b-bad">NO-GO</span>' :
                  i.decision.verdict === "revoir" ? '<span class="badge b-warn">à revoir</span>' : '<span class="badge b-muted">en cours</span>';
      return '<tr data-act="open" data-id="' + i.id + '"><td><b>#' + (idx+1) + '</b></td>' +
        '<td><div class="t-title">' + esc(i.title) + '</div><div class="tiny muted">' + esc(i.code) + (i.category ? " · " + esc(i.category) : "") + '</div></td>' +
        '<td>' + stageBadge(i.stage) + '</td>' +
        '<td style="min-width:120px">' + progressBar(pctProg) + '<span class="tiny muted">' + pctProg + ' % du processus</span></td>' +
        '<td>' + scorePill(i) + '</td>' +
        '<td><span class="badge ' + BUCKETS[i.scoring.bucket].cls + '">' + BUCKETS[i.scoring.bucket].label + '</span></td>' +

   }).join("") : '<tr><td colspan="9">' + emptyBox("Portefeuille vide.", "◌") + '</td></tr>') +

  '<div class="split">' +
    '<div class="card"><div class="card-head"><div class="card-title">Conditions de passage — où ça coince</div></div><div class="card-body scroll-y">' +
      (recos.length ? recos.slice(0,20).map(r => {
        const g = gateCheck(r.i, r.nx.id);
        const missing = g.items.filter(x => !x.ok);
        return '<div class="li-item"><div class="li-body"><div class="li-title">' + esc(r.i.title) + ' → ' + esc(r.nx.label) + '</div>' +

    '<div class="card"><div class="card-head"><div class="card-title">Répartition par priorité</div></div><div class="card-body">' +
      barList(["A","B","C","D"].map(b => ({ label:BUCKETS[b].label, value:active.filter(i => i.scoring.bucket === b).length,

      '<div class="sep"></div><div class="card-title" style="margin-bottom:8px">Répartition par catégorie</div>' +
      barList(Object.keys(s.byCat).map(k => ({ label:k, value:s.byCat[k] })).sort((a,b) => b.value-a.value).slice(0,9)) +
    '</div></div>' +
  '</div>';
}

/* ============================================================================
   11. Fiche idée / projet — vue détaillée
   ============================================================================ */
function setPath(obj, path, value){
  const parts = path.split("."); let o = obj;
  for (let k=0; k<parts.length-1; k++) o = o[parts[k]];
  o[parts[parts.length-1]] = value;
}
function getPath(obj, path){
  return path.split(".").reduce((o,k) => (o||{})[k], obj);
}
function fieldHtml(i, path, type, opts){
  opts = opts || {};
  const v = getPath(i, path);
  const ro = opts.readonly ? " readonly" : "";
  const dis = opts.disabled ? " disabled" : "";
  if (type === "textarea") return '<textarea class="input" data-act="field" data-id="' + i.id + '" data-path="' + path + '" rows="' + (opts.rows||4) + '" placeholder="' + esc(opts.ph||"") + '"' + dis + ro + '>' + esc(v||"") + '</textarea>';
  if (type === "number") return '<input class="input" type="number" min="0" step="any" data-act="field" data-id="' + i.id + '" data-path="' + path + '" data-type="number" value="' + (v===undefined||v===null||v===""?"":esc(v)) + '"' + dis + ro + '>';
  if (type === "date")   return '<input class="input" type="date" data-act="field" data-id="' + i.id + '" data-path="' + path + '" value="' + esc(v||"") + '"' + dis + ro + '>';
  if (type === "select") return '<select class="input" data-act="field" data-id="' + i.id + '" data-path="' + path + '"' + dis + '>' +
      (opts.opts||[]).map(o => { const val = Array.isArray(o)?o[0]:o, lab = Array.isArray(o)?o[1]:o; return '<option value="' + esc(val) + '"' + (String(v) === String(val) ? " selected" : "") + '>' + esc(lab) + '</option>'; }).join("") + '</select>';

/* ------ Onglets ------ */
function tabsFor(i){
  const pending = essentialPending(i);
  const t = [
    ["synthese","Synthèse",""],
    ["questions","Questionnement", pending ? '<span class="badge b-warn">' + pending + '</span>' : ""],
    ["analyse","Analyse",""],
    ["evaluation","Évaluation", i.scoring.score ? '<span class="tiny">' + i.scoring.score + '</span>' : ""],
    ["validation","Décision",""]
  ];
  if (isProjectStage(i.stage)){
    const tasks = (i.project.tasks||[]).filter(x => x.status !== "terminée").length;
    t.push(["cadrage","Cadrage",""]);
    t.push(["planning","Planning & jalons",""]);
    t.push(["taches","Tâches", tasks ? '<span class="tiny">' + tasks + '</span>' : ""]);
    t.push(["budget","Budget",""]);
    t.push(["revue","Revue & tests",""]);
    t.push(["bilan","Bilan",""]);
  } else {
    t.push(["projet","Projet 🔒",""]);
  }
  t.push(["historique","Historique",""]);
  return t;
}

function tabQuestions(i){
  const byStage = {};
  Object.keys(i.answers).forEach(k => {
    const a = i.answers[k]; const st = a.stage || "capture";
    (byStage[st] = byStage[st] || []).push(Object.assign({ id:k }, a));
  });
  const total = Object.keys(i.answers).length;
  const answered = Object.keys(i.answers).filter(k => i.answers[k].status === "répondu" || i.answers[k].status === "sans objet").length;
  const pendingEss = essentialPending(i);
  return '' +
  '<div class="card section"><div class="card-body" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">' +
    '<div style="flex:1;min-width:240px"><div class="sec-title">Avancement du questionnement</div>' +
      '<div class="small muted">' + answered + '/' + total + ' question(s) traitée(s)' + (pendingEss ? ' · <b style="color:var(--warn)">' + pendingEss + ' question(s) essentielle(s) en attente</b>' : ' · <span style="color:var(--ok)">toutes les questions essentielles sont traitées</span>') + '</div>' +
      '<div style="margin-top:8px">' + progressBar(total ? (answered/total)*100 : 0) + '</div></div>' +
    '<div class="toolbar">' +
      '<button class="btn sm" data-act="q-add" data-id="' + i.id + '">＋ Question personnalisée</button>' +
      '<button class="btn sm ghost" data-act="q-load-all" data-id="' + i.id + '">Charger les questionnaires des étapes à venir</button>' +
    '</div></div></div>' +

  (total ? settings().pipeline.filter(s => s.questions).map(s => {
    const qs = byStage[s.id] || [];
    if (!qs.length && !s.questions) return "";
    return '<div class="section"><div class="sec-head"><span class="dot" style="background:' + s.color + '"></span>' +
      '<span class="sec-title">' + esc(s.label) + '</span><div class="spacer"></div>' +
      '<span class="tiny muted">' + qs.filter(q => q.status === "répondu" || q.status === "sans objet").length + "/" + qs.length + ' traitées</span>' +

/* ------ Onglet Évaluation ------ */
function tabEvaluation(i){
  const crit = settings().criteria;
  const active = activeCriteria();
  const r = computeScore(i);
  const q = quadrantOf(i);
  const b = BUCKETS[i.scoring.bucket];
  const LABELS = { 1:"très faible", 2:"faible", 3:"moyen", 4:"fort", 5:"très fort" };
  return '<div class="split">' +
  '<div class="card"><div class="card-head"><div class="card-title">Grille de notation pondérée</div>' +
    '<div class="spacer"></div><span class="tiny muted">' + r.filled + '/' + r.total + ' critères notés</span>' +
    '<button class="btn sm ghost" data-act="nav" data-nav="settings">Pondérations</button></div>' +
    '<div class="card-body">' +
    active.map(c => {
      const v = i.scoring.values[c.id] || "";
      const val = Number(v)||0;
      const norm = val ? (c.inverse ? (1-((val-1)/4)) : ((val-1)/4)) : 0;
      return '<div class="qitem" style="margin-bottom:10px">' +
        '<div class="qhead"><span class="qtext">' + esc(c.label) + '</span>' +
          '<span class="badge b-muted" title="Poids dans le score">poids ' + c.weight + '</span>' +
          (c.inverse ? '<span class="badge b-warn" title="Critère inversé : une note élevée dégrade le score">inversé</span>' : '') +
          '<span class="pill-score" style="color:' + (norm >= .66 ? "#34c48d" : norm >= .33 ? "#f2b544" : "#ff6b6b") + '">' + (v === "" ? "—" : v + "/5") + '</span></div>' +
        '<div class="flex mt8" style="gap:6px">' +
          [1,2,3,4,5].map(n => '<button class="chip' + (String(v) === String(n) ? " active" : "") + '" style="flex:1;justify-content:center" data-act="rate" data-id="' + i.id + '" data-crit="' + c.id + '" data-v="' + n + '" title="' + LABELS[n] + '">' + n + '</button>').join("") +
          '<button class="btn sm ghost" data-act="rate" data-id="' + i.id + '" data-crit="' + c.id + '" data-v="" title="Effacer">✕</button>' +
        '</div>' +
        '<div class="hint">' + (val ? LABELS[val] + (c.inverse ? " — plus la note est élevée, plus le score baisse" : " — plus la note est élevée, plus le score monte") : "Non noté : ce critère est ignoré dans le calcul") + '</div>' +
      '</div>';
    }).join("") +
    '</div></div>' +
  '<div>' +
    '<div class="card section"><div class="card-head"><div class="card-title">Résultat automatique</div>' +
      '<div class="spacer"></div><button class="btn sm ghost" data-act="reset-score" data-id="' + i.id + '">Réinitialiser</button></div>' +
      '<div class="card-body center">' +
      '<div style="font-size:46px;font-weight:800;color:' + bucketColor(i.scoring.score) + ';line-height:1">' + i.scoring.score + '<span style="font-size:18px;opacity:.6">/100</span></div>' +
      '<div class="mt8"><span class="badge ' + b.cls + '">' + b.label + '</span> ' + (q ? '<span class="badge ' + q.cls + '">' + q.label + '</span>' : '') + '</div>' +
      '<div class="hint mt8">' + b.hint + (q ? ' · ' + q.hint : '') + '</div>' +
      '<div class="sep"></div>' +
      '<div class="tiny muted">Rang actuel dans le portefeuille</div><div style="font-size:22px;font-weight:700">#' + (rankOf(i.id).rank||"—") + ' <span class="tiny muted">sur ' + rankedIdeas().length + ' idées actives</span></div>' +
      '<div class="sep"></div><div class="tiny muted">Détail de la contribution des critères</div>' +
      '<div style="margin-top:8px">' + barList(active.map(c => {
        const v = Number(i.scoring.values[c.id])||0;
        const norm = v ? Math.round((c.inverse ? (1-((v-1)/4)) : ((v-1)/4)) * c.weight) : 0;
        return { label:c.label, value:norm };
      }), () => "linear-gradient(90deg,var(--accent),var(--accent2))") + '</div>' +
      '<div class="hint">Valeur en points apportés (poids × note normalisée). Total maximum : ' + active.reduce((s,c) => s+c.weight, 0) + ' points.</div>' +
    '</div></div>' +
    '<div class="card section"><div class="card-head"><div class="card-title">Seuils de priorité en vigueur</div></div><div class="card-body tiny">' +
      '<div>Score ≥ <b>' + settings().bucketA + '</b> → priorité <b>A</b> (à lancer)</div>' +
      '<div class="mt8">Score ≥ <b>' + settings().bucketB + '</b> → priorité <b>B</b> (à planifier)</div>' +
      '<div class="mt8">Score ≥ <b>' + settings().bucketC + '</b> → priorité <b>C</b> (backlog)</div>' +
      '<div class="mt8">Score &lt; ' + settings().bucketC + ' → priorité <b>D</b> (à retravailler)</div>' +
      '<button class="btn sm ghost mt8 wide" data-act="nav" data-nav="matrix">Voir la matrice impact / effort</button>' +
    '</div></div>' +
  '</div></div>';
}

/* ------ Onglet Décision / Validation ------ */
function tabValidation(i){
  const st = byId(settings().pipeline, "validation") || { label:"Validation" };
  const r = computeScore(i);
  const checks = [
    { l:"Questionnement essentiel complet", ok: essentialPending(i) === 0 },
    { l:"Hypothèses documentées", ok: listOf(i,"analysis.hypotheses").length > 0 },
    { l:"Solutions comparées", ok: listOf(i,"analysis.solutions").length > 0 },
    { l:"Risques identifiés", ok: listOf(i,"analysis.risks").length > 0 },
    { l:"Grille de scoring complète", ok: r.filled === r.total && r.total > 0 },
    { l:"Score ≥ seuil de priorité C", ok: i.scoring.score >= settings().bucketC }
  ];
  const ready = checks.filter(c => c.ok).length;
  const d = i.decision;
  return '<div class="split">' +
  '<div class="card"><div class="card-head"><div class="card-title">Dossier de validation</div>' +
   '<div class="spacer"></div><span class="badge ' + (ready === checks.length ? "b-ok" : "b-warn") + '">' + ready + "/" + checks.length + ' prérequis</span></div>' +
   '<div class="card-body">' +
   '<div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:12px">' +
     miniStat("Score pondéré", i.scoring.score + "/100", bucketColor(i.scoring.score)) +
     miniStat("Priorité", BUCKETS[i.scoring.bucket].label, bucketColor(i.scoring.score)) +
   '</div>' +
   checks.map(c => '<div class="gate-item ' + (c.ok ? "ok" : "ko") + '"><span>' + (c.ok ? "✔" : "✕") + '</span><span>' + esc(c.l) + '</span></div>').join("") +
   '<div class="sep"></div>' +
   (can("decide") ? '' : '<div class="hint">Votre rôle ne permet pas de décider — vous pouvez préparer le dossier et commenter.</div>') +
  '</div></div>' +

  '<div class="card"><div class="card-head"><div class="card-title">Décision</div></div><div class="card-body">' +
    (d.verdict ? '<div class="alert ' + (d.verdict === "go" ? "high" : d.verdict === "nogo" ? "high" : "med") + '" style="border-left-color:' +
      (d.verdict === "go" ? "var(--ok)" : d.verdict === "nogo" ? "var(--bad)" : "var(--warn)") + ';cursor:default">' +
      '<span class="ai">' + (d.verdict === "go" ? "✔" : d.verdict === "nogo" ? "✕" : "↻") + '</span><span><b>' +
      (d.verdict === "go" ? "VALIDÉE (GO)" : d.verdict === "nogo" ? "SANS SUITE (NO-GO)" : "À RETRAVAILLER") + '</b><br>' +
      esc(d.rationale) + (d.conditions ? '<br><i>Conditions : ' + esc(d.conditions) + '</i>' : '') +
      '<br><span class="tiny muted">Décidé le ' + fmtDT(d.at) + ' par ' + esc((user(d.by)||{}).name || "—") + '</span></span></div>' : '') +
    '<div class="field"><label class="f">Décision</label>' +
      fieldHtml(i, "decision.verdict", "select", { opts:[["","— décision non prise —"],["go","GO — l'idée est validée, on passe en projet"],["revoir","À RETRAVAILLER — compléter puis repasser en validation"],["nogo","NO-GO — sans suite (conservée et traçable)"]] }) + '</div>' +
    '<div class="field"><label class="f">Justification (obligatoire pour valider)</label>' +
      fieldHtml(i, "decision.rationale", "textarea", { rows:4, ph:"Pourquoi cette décision ? Sur quels éléments du dossier s'appuie-t-elle ?" }) + '</div>' +
    '<div class="field"><label class="f">Conditions / réserves</label>' +
      fieldHtml(i, "decision.conditions", "textarea", { rows:3, ph:"Ex. : à lancer après la refonte du SI ; budget plafonné à 5 k€…" }) + '</div>' +
    '<div class="toolbar">' +
      (can("decide") ? '<button class="btn ok" data-act="verdict" data-id="' + i.id + '" data-v="go">✔ Valider (GO) et passer en projet</button>' : '') +
      (can("decide") ? '<button class="btn" data-act="verdict" data-id="' + i.id + '" data-v="revoir">↻ À retravailler</button>' : '') +
      (can("decide") ? '<button class="btn bad" data-act="verdict" data-id="' + i.id + '" data-v="nogo">✕ Sans suite</button>' : '') +
    '</div>' +
    '<div class="sep"></div>' +
    '<div class="qmeta"><span>Validateur attendu : <b>' + esc((STATE.users.filter(u => u.role === "validateur" || u.role === "admin")[0]||{}).name || "—") + '</b></span>' +
    '<span>Étape du processus : ' + esc(st.label) + '</span></div>' +
  '</div></div></div>';
}

function download(filename, content, mime){
  if (EMBED){
    const w = window.claude && window.claude.use ? window.claude.use("downloads") : Promise.resolve(null);
    Promise.resolve(w).then(dl => {
      if (!dl) { copyModal(filename, content); return; }
      dl.save({ filename, data: content }).then(() => toast("Fichier " + filename + " enregistré.", "ok"))
        .catch(e => { if (e && e.code === "declined") toast("Enregistrement annulé.", "warn"); else copyModal(filename, content); });
    }).catch(() => copyModal(filename, content));
    return;
  }
  try {
    const blob = new Blob([content], { type:mime || "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Fichier " + filename + " généré.", "ok");
  } catch(e){
    modal({ title:"Copier le contenu", size:"lg", body:'<div class="hint">Le téléchargement est bloqué dans cet aperçu : copiez le contenu ci-dessous et enregistrez-le dans un fichier <b>' + esc(filename) + '</b>.</div>' +
      '<textarea class="input" rows="18" style="font-family:ui-monospace,monospace;font-size:11px">' + esc(content.slice(0,200000)) + '</textarea>',
      foot:'<button class="btn" data-act="close-modal">Fermer</button>' });
  }
}
function copyModal(filename, content){
  modal({ title:"Copier la sauvegarde", size:"lg",
    body:'<div class="hint mb8">Le téléchargement direct n\'est pas possible ici. Cliquez sur « Copier », puis collez le texte dans un fichier nommé <b>' + esc(filename) + '</b> (Bloc-notes, puis Enregistrer sous), ou dans une note Google Drive.</div>' +
      '<textarea class="input" id="copyArea" rows="16" readonly style="font-family:ui-monospace,monospace;font-size:11px">' + esc(content) + '</textarea>',
    foot:'<button class="btn" data-act="close-modal">Fermer</button><button class="btn primary" data-act="copy-area">Copier</button>' });
}
function slug(s){ return String(s||"fiche").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase().slice(0,60); }

function exportCsv(){
  if (!guard("export")) return;
  const list = filteredIdeas();
  const head = ["Code","Titre","Catégorie","Mots-clés","Étape","Phase","Statut","Score","Priorité","Urgence","Auteur","Créée le","Modifiée le","Décision","Avancement projet","Budget estimé","Coût réel","Questions essentielles en attente"];
  const rows = list.map(i => [ i.code, i.title, i.category, (i.tags||[]).join(" | "), (stageDef(i.stage)||{}).label,
    (stageDef(i.stage)||{}).phase, i.status, i.scoring.score, i.scoring.bucket, i.urgency,
    (user(i.author)||{}).name || "", i.createdAt.slice(0,10), i.updatedAt.slice(0,10), i.decision.verdict || "",
    projectProgress(i) + " %", budgetTotals(i).est, budgetTotals(i).real, essentialPending(i) ]);
  const csv = [head].concat(rows).map(r => r.map(c => {
    const s = String(c === undefined || c === null ? "" : c).replace(/"/g,'""');
    return /[";\n]/.test(s) ? '"' + s + '"' : s;
  }).join(";")).join("\r\n");
  download("boite-a-idees_" + today() + ".csv", "\ufeff" + csv, "text/csv;charset=utf-8");
}

function importJson(text, mode){
  let data;
  try { data = JSON.parse(text); } catch(e){ toast("Fichier JSON illisible : " + e.message, "bad"); return; }
  if (data && data.meta && data.ideas){                     // sauvegarde complète
    if (mode === "merge"){
      const existing = new Set(STATE.ideas.map(i => i.id));
      const added = data.ideas.filter(i => !existing.has(i.id));
      STATE.ideas = STATE.ideas.concat(added);
      SET_STATE_AFTER_IMPORT(added.length + " idée(s) fusionnée(s) depuis la sauvegarde.");
    } else {
      STATE = migrate(data);
      persistNow(); toast("Sauvegarde restaurée : " + STATE.ideas.length + " idée(s).", "ok");
      UI.view = "dashboard"; UI.ideaId = null; render();
    }
  } else if (data && data.code && data.title){               // fiche unique
    const i = normalizeIdea(data);
    if (ideas().some(x => x.code === i.code)) i.code = nextCode();
    i.id = uid("idea");
    STATE.ideas.unshift(i);
    logAct("import", "Import de la fiche " + i.code, i.id);
    persistNow(); toast("Fiche importée : " + i.title, "ok"); render();
  } else {
    toast("Format non reconnu.", "bad");
  }
}

    i.stageLog.map(l => '<tr><td>' + esc((stageDef(l.stage)||{}).label || l.stage) + '</td><td>' + fmtDT(l.at) + '</td><td>' + (l.exitAt ? fmtDT(l.exitAt) : "en cours") + '</td><td>' +
      (l.exitAt ? Math.round((new Date(l.exitAt) - new Date(l.at))/86400000) : daysSince(l.at)) + ' j</td></tr>').join("") + '</table>' +
    '<div class="p-meta" style="margin-top:14px">Document généré par Boîte à Idées v' + APP.version + ' — ' + esc(settings().org || STATE.meta.org) + '</div></div>';
  if (EMBED){
    modal({ title:"Fiche complète", sub:esc(i.code), size:"xl",
      body:'<div class="hint mb8">L\'impression n\'est pas disponible ici. Pour un PDF, ouvrez la version du site (Vercel) ou le fichier HTML.</div><div style="background:#fff;color:#111;border-radius:8px;padding:16px" class="fiche-embed">' + html + '</div>',
      foot:'<button class="btn" data-act="close-modal">Fermer</button><button class="btn primary" data-act="fiche-save" data-id="' + i.id + '">⤓ Enregistrer la fiche (HTML imprimable)</button>' });
    window.__ficheHtml = '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>' + esc(i.code + " — " + i.title) + '</title><style>body{font-family:Georgia,serif;max-width:900px;margin:24px auto;padding:0 16px;color:#111}table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}th,td{border:1px solid #bbb;padding:4px 6px;text-align:left}.p-block{border:1px solid #bbb;border-radius:6px;padding:8px 10px;margin-bottom:8px;white-space:pre-wrap}h2{font-size:15px;margin:16px 0 6px;border-bottom:1px solid #999}</style></head><body>' + html + '</body></html>';
    window.__ficheName = "fiche_" + slug(i.title) + "_" + i.code + ".html";
    return;
  }
  $("#printArea").innerHTML = html;
  setTimeout(() => window.print(), 120);
}

/* ---------------------------- 12.3 Actions métier ---------------------------- */
function tryAdvance(i, targetId, opts){
  opts = opts || {};
  if (!guard("advance")) return;
  const g = gateCheck(i, targetId);
  if (!g.ok && !opts.force){ openGateModal(i, targetId, g); return; }
  if (!g.ok && opts.force){
    if (!opts.note || opts.note.trim().length < 5){ toast("Un motif écrit est exigé pour forcer un passage.", "warn"); return; }
    enterStage(i, targetId, { force:true, note:opts.note });
    closeModal();
    toast("Étape forcée : passage à « " + (stageDef(targetId)||{}).label + " ».", "warn");
    render(); return;
  }
  enterStage(i, targetId, {});
  toast("Étape validée : passage à « " + (stageDef(targetId)||{}).label + " ».", "ok");
  render();
}
function openGateModal(i, targetId, g){
  const nx = stageDef(targetId);

      '<div class="sep"></div>' +
      (canForce()
        ? '<label class="switch mb8"><input type="checkbox" id="forceChk"> Forcer le passage malgré les conditions manquantes</label>' +

  });
}
